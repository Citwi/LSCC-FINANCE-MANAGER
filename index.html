function dashboard(){let generalI=sum(db.income.filter(x=>(x.incomeGroup||'General')==='General'&&!x.projectId)),generalE=sum(db.expenses.filter(x=>x.financeGroup!=='Mercy Ministry'&&!x.specialDepartmentId&&!x.mercy)),projectI=sum(db.income.filter(x=>x.incomeGroup==='Project'||x.projectId)),projectE=sum(db.projectExpenses||[]),specialI=sum(db.specialIncome||[]),specialE=sum(db.specialExpenses||[]),specialBal=specialI-specialE,mercyI=sum(db.mercyIncome||[]),mercyE=sum(db.mercyExpenses||[]),opening=+(db.settings.openingBalance||0),churchBal=opening+generalI-generalE,projectBal=projectI-projectE,mercyBal=mercyI-mercyE,totalPortfolioIncome=generalI+projectI+specialI+mercyI;let male=db.members.filter(m=>m.gender==='Male').length,female=db.members.filter(m=>m.gender==='Female').length,unknown=Math.max(0,db.members.length-male-female);let months={};db.income.filter(x=>(x.incomeGroup||'General')==='General'&&!x.projectId).forEach(x=>{let m=x.date?.slice(0,7);if(m)months[m]=(months[m]||0)+(+x.amount||0)});let generalCats=cats.filter(c=>!/^project/i.test(c)),cs=generalCats.map(c=>[c,sum(db.income.filter(x=>(x.incomeGroup||'General')==='General'&&!x.projectId&&x.category===c))]),mx=Math.max(1,...cs.map(x=>x[1]));return `<div class="panel" style="display:flex;justify-content:space-between;align-items:center"><div><b>Current Date & Time</b></div><div><span id="clock" style="font-size:22px;font-weight:800">--</span> <button class="btn no-print" onclick="refreshDashboard()">Refresh Balances</button></div></div><div class="cards"><div class="card"><div class="label">CURRENT OPERATIONAL BALANCE</div><div class="value">${money(churchBal)}</div><div class="sub">Main Church account net balance</div></div><div class="card"><div class="label">TOTAL INCOME</div><div class="value green">${money(generalI)}</div></div><div class="card"><div class="label">TOTAL EXPENSE</div><div class="value red">${money(generalE)}</div></div><div class="card"><div class="label">MEMBERS</div><div class="value function income(){return `<div class="panel"><h2>General Income / Offerings</h2><div class="notice">Use this section for tithes, offerings, thanksgiving and other non-project income. Receipt numbers are generated automatically.</div><div class="form"><div><label>Date</label><input id="idate" type="date" value="${today()}"></div><div><label>Service / Occasion</label><input id="iservice"></div><div><label>Income Type</label><select id="icat">${cats.filter(x=>!/^project/i.test(x)).map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div><label>Amount</label><input id="iamt" type="number" step=".01"></div><div><label>Payment Method</label><select id="ipay"><option>Cash</option><option>Bank</option><option>M-Pesa</option><option>Cheque</option><option>Other</option></select></div><div><label>Receipt Number</label><input id="iref" placeholder="Auto-generated on save" readonly></div></div><div style="margin-top:12px"><label>Notes</label><textarea id="inotes"></textarea></div><div class="actions"><button class="primary" onclick="addIncome()">Save General Income</button></div></div>

function addProjectIncome(){let partner=v('pipartner'),member=v('pimember'),x={id:uid(),date:v('pidate'),service:v('piservice'),category:'Project Contribution',amount:+v('piamt'),payment:v('pipay'),ref:v('piref')||nextNo('receipt','LSCC-RCT'),receiptNo:v('piref')||db.counters.receipt,projectId:v('piproj'),partnerId:partner==='OTHER'?'':partner,memberId:member==='OTHER'?'':member,otherPartner:partner==='OTHER'?v('piotherpartner').trim():'',otherMember:member==='OTHER'?v('piothermember').trim():'',notes:'',incomeGroup:'Project'};if(!x.date||x.amount<=0||!x.projectId)return alert('Enter date, project and amount.');if(partner==='OTHER'&&!x.otherPartner&&member!=='OTHER')return alert('Enter the other contributor name.');if(member==='OTHER'&&!x.otherMember&&partner!=='OTHER')return alert('Enter the other member name.');db.income.push(x);save();alert('Project contribution saved with receipt '+x.ref);go('income')}

function logs(){let a=[...db.income.map(x=>({...x,t:'Income'})),...db.expenses.map(x=>({...x,t:'Expense'}))].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="panel"><div class="actions no-print"><input class="search" id="ls" placeholder="Search entries..." oninput="logList()"><select id="lt" onchange="logList()"><option>All</option><option>Income</option><option>Expense</option></select><button class="btn" onclick="csv()">Export CSV</button></div><div id="ll">${logTable(a)}</div></div>`}

function transactionManagement(){
  let a=db.deletedTransactions.slice().sort((x,y)=>(y.deletedAt||'').localeCompare(x.deletedAt||''));
  let q=String(v('tmSearch')||'').toLowerCase();
  if(q)a=a.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
  let rows=a.map(x=>`<tr><td>${esc(x.auditId)}</td><td>${esc(x.deletedAt||'-')}</td><td>${esc(x.username||'-')}</td><td>${esc(x.ledger||'-')}</td><td>${esc(x.transactionDate||'-')}</td><td>${esc(x.name||'-')}</td><td>${esc(x.reference||'-')}</td><td>${money(x.amount)}</td><td>${esc(x.reason||'-')}</td><td><button class="btn" onclick="viewDeletedTransaction('${x.id}')">View</button></td></tr>`).join('');

}
function renderTransactionManagement(){let el=$('view');if(!el)return;el.innerHTML=transactionManagement()}
function viewDeletedTransaction(id){let x=db.deletedTransactions.find(q=>q.id===id);if(!x)return;alert(`Audit ID: ${x.auditId}\nUsername: ${x.username}\nLedger: ${x.ledger}\nTransaction Date: ${x.transactionDate||'-'}\nReference: ${x.reference||'-'}\nAmount: ${money(x.amount)}\nReason: ${x.reason||'-'}`)}
function receiptSearchTable(q){q=String(q||'').toLowerCase();let rows=[];db.income.forEach(x=>{let m=db.members.find(mm=>mm.id===x.memberId);let name=m?.name||x.otherMember||x.otherPartner||'';let idNo=m?.idNo||'';let churchId=m?.churchId||'';if(x.memberId||m||x.otherMember){rows.push({x,name,idNo,churchId,ledger:(x.incomeGroup||'General')==='Project'?'Project Contribution':'Main Church Income'})}});db.mercyIncome.forEach(x=>{let name=x.contributorName||'',idNo=x.idNo||'',churchId=x.churchId||'';if(name||churchId||idNo)rows.push({x,name,idNo,churchId,ledger:'Mercy Ministry Contribution',mercy:true})});rows=rows.filter(r=>!q||`${r.name} ${r.idNo} ${r.churchId} ${r.x.ref||r.x.receiptNo||''}`.toLowerCase().includes(q)).sort((a,b)=>String(b.x.date||'').localeCompare(String(a.x.date||'')));return rows.length?`<table><tr><th>Date</th><th>Member / Contributor</th><th>National ID</th><th>Church Membership</th><th>Ledger</th><th>Category</th><th>Receipt</th><th>Amount</th><th></th></tr>${rows.map(r=>`<tr><td>${esc(r.x.date)}</td><td>${esc(r.name||'-')}</td><td>${esc(r.idNo||'-')}</td><td>${esc(r.churchId||'-')}</td><td>${esc(r.ledger)}</td><td>${esc(r.x.category||r.x.purpose||'-')}</td><td>${esc(r.x.ref||r.x.receiptNo||'-')}</td><td class="green">${money(r.x.amount)}</td><td><button class="btn" onclick="${r.mercy?`printMercyContributionReceipt('${r.x.id}')`:`printMemberReceipt('${r.x.id}')`}">Reprint Receipt</button></td></tr>`).join('')}</table>`:'<div class="empty">No member transactions found.</div>'}
function receiptSearchList(){let el=$('receiptResults');if(el)el.innerHTML=receiptSearchTable(v('receiptSearch'))}
function printMemberReceipt(id){let x=db.income.find(q=>q.id===id);if(!x)return;let m=db.members.find(q=>q.id===x.memberId),project=db.projects.find(q=>q.id===x.projectId),name=m?.name||x.otherMember||x.otherPartner||'Church Member';let html=`<div style="max-width:680px;margin:auto;border:1px solid #ccc;padding:28px;font-family:Arial"><h2 style="text-align:center">${esc(db.settings.name)}</h2><h3 style="text-align:center">MEMBER CONTRIBUTION RECEIPT</h3><p><b>Receipt No:</b> ${esc(x.ref||x.receiptNo||'-')} &nbsp; <b>Date:</b> ${esc(x.date)}</p><table style="width:100%;border-collapse:collapse"><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Member / Contributor</th><td style="border:1px solid #ccc;padding:8px">${esc(name)}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">National ID</th><td style="border:1px solid #ccc;padding:8px">${esc(m?.idNo||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Church Membership</th><td style="border:1px solid #ccc;padding:8px">${esc(m?.churchId||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Income Type</th><td style="border:1px solid #ccc;padding:8px">${esc(x.category||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Project</th><td style="border:1px solid #ccc;padding:8px">${esc(project?.name||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Payment Method</th><td style="border:1px solid #ccc;padding:8px">${esc(x.payment||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Amount</th><td style="border:1px solid #ccc;padding:8px"><b>${money(x.amount)}</b></td></tr></table><br><p>Prepared by: ${esc(currentUser()?.name||'-')}</p><p style="margin-top:50px">Authorized Signature: __________________________</p></div>`;printReceiptHtml(html,x.ref||x.receiptNo||'Member Receipt')}
function printMercyContributionReceipt(id){let x=db.mercyIncome.find(q=>q.id===id);if(!x)return;let h=db.homeCells.find(q=>q.id===x.homeCellId);let html=`<div style="max-width:680px;margin:auto;border:1px solid #ccc;padding:28px;font-family:Arial"><h2 style="text-align:center">${esc(db.settings.name)}</h2><h3 style="text-align:center">MERCY MINISTRY CONTRIBUTION RECEIPT</h3><p><b>Receipt No:</b> ${esc(x.ref||x.receiptNo||'-')} &nbsp; <b>Date:</b> ${esc(x.date)}</p><p><b>Home Cell:</b> ${esc(h?.name||'-')}</p><table style="width:100%;border-collapse:collapse"><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Contributor</th><td style="border:1px solid #ccc;padding:8px">${esc(x.contributorName||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">National ID</th><td style="border:1px solid #ccc;padding:8px">${esc(x.idNo||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Church Membership</th><td style="border:1px solid #ccc;padding:8px">${esc(x.churchId||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Purpose</th><td style="border:1px solid #ccc;padding:8px">${esc(x.category||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Amount</th><td style="border:1px solid #ccc;padding:8px"><b>${money(x.amount)}</b></td></tr></table><br><p>Prepared by: ${esc(currentUser()?.name||'-')}</p><p style="margin-top:50px">Authorized Signature: __________________________</p></div>`;printReceiptHtml(html,x.ref||x.receiptNo||'Mercy Receipt')}
function printReceiptHtml(html,title){let w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print the receipt.');w.document.write(`<html><head><title>${esc(title)}</title></head><body>${html}</body></html>`);w.document.close();w.focus();w.print()}

function inquiry(){
return `<div class="panel"><h2>Individual Project Partner Contribution Inquiry</h2>
<div class="notice">Select a project and partner to generate a contribution statement showing each individual contribution, dates, references and totals.</div>
<div class="form">
<div><label>Project</label><select id="qproj"><option value="">-- Select Project --</option>${db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
<div><label>Partner</label><select id="qpartner"><option value="">-- Select Partner --</option>${db.partners.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.idNo)})</option>`).join('')}</select></div>
</div>
<div class="actions"><button class="primary" onclick="generateInquiry()">Generate Statement</button><button class="btn" onclick="print()">Print Statement</button></div>
<div id="inquiryOut"></div></div>`;
}
function generateInquiry(){
let pid=v('qproj'),rid=v('qpartner');
if(!pid||!rid)return alert('Select both a project and partner.');
let p=db.projects.find(x=>x.id===pid),r=db.partners.find(x=>x.id===rid);
let rows=db.income.filter(x=>x.projectId===pid&&x.partnerId===rid).sort((a,b)=>a.date.localeCompare(b.date));
let total=sum(rows),m=r.memberId?db.members.find(x=>x.id===r.memberId):null;
$('inquiryOut').innerHTML=`<div class="panel" style="margin-top:18px"><h2>${esc(p.name)} — Partner Contribution Statement</h2>
<p><b>Partner:</b> ${esc(r.name)} &nbsp; <b>ID:</b> ${esc(r.idNo)} &nbsp; <b>Contact:</b> ${esc(r.contact)} &nbsp; <b>Status:</b> ${esc(r.type)}</p>
${m?`<p><b>Church Member:</b> ${esc(m.name)} (${esc(m.churchId)})</p>`:''}
<table><tr><th>Date</th><th>Category</th><th>Payment</th><th>Reference</th><th>Amount</th></tr>
${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.payment)}</td><td>${esc(x.ref||'-')}</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No contributions found for this project and partner.</td></tr>'}
<tr><th colspan="4">TOTAL CONTRIBUTION</th><th class="green">${money(total)}</th></tr></table></div>`;
}
function homecells(){return `<div class="panel"><h2>Home Cell Register</h2><div class="form"><div><label>Home Cell Name</label><input id="hname"></div><div><label>Leader</label><select id="hleaderId" onchange="autofillHomeLeader()"><option value="">-- Select Member Leader --</option>${db.members.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.churchId)})</option>`).join('')}</select></div><div><label>Leader Name</label><input id="hleader" readonly></div><div><label>Contact</label><input id="hcontact" readonly></div><div><label>Meeting Location</label><input id="hlocation"></div><div><label>Meeting Day</label><input id="hday" placeholder="e.g. Wednesday"></div><div><label>Description</label><input id="hdesc"></div></div><div class="actions"><button class="primary" onclick="addHomeCell()">Register Home Cell</button></div></div>
<div class="panel"><h2>Mercy Support — Home Cell Contributions & Expenses</h2><div class="notice">Mercy Support is kept separately from main church finance. Contributor details are linked to the selected home-cell member and can be reviewed before saving.</div><div class="grid">
<div><h3>Mercy Support Contribution</h3><div class="form"><div><label>Date</label><input id="miDate" type="date" value="${today()}"></div><div><label>Home Cell</label><select id="miCell" onchange="loadMercyContributors('miCell','miMember','miName','miChurchId','miContact','miResidence')"><option value="">-- Select Home Cell --</option>${db.homeCells.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('')}</select></div><div><label>Find Contributor (Name, ID or Membership Number)</label><input id="mercyPersonSearch" placeholder="Type name, ID or LSCC number" oninput="filterMercyContributors()"></div><div><label>Contributor</label><select id="miMember" onchange="autofillMercyContributor()"><option value="">-- Select Contributor --</option></select></div><div><label>Contributor Name</label><input id="miName"></div><div><label>Membership No.</label><input id="miChurchId"></div><div><label>Contact</label><input id="miContact"></div><div><label>Residence</label><input id="miResidence"></div><div><label>Purpose / Category</label><input id="miCat" placeholder="e.g. Mercy support contribution"></div><div><label>Amount</label><input id="miAmt" type="number" step=".01"></div></div><button class="primary" onclick="addMercyIncome()">Save Mercy Contribution</button></div>
<div><h3>Mercy Support Expense</h3><div class="form"><div><label>Date</label><input id="meDate" type="date" value="${today()}"></div><div><label>Home Cell</label><select id="meCell"><option value="">-- Select Home Cell --</option>${db.homeCells.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('')}</select></div><div><label>Expense Purpose</label><input id="mePurpose" placeholder="e.g. Medical assistance / food support"></div><div><label>Payee / Recipient</label><input id="mePayee"></div><div><label>Amount</label><input id="meAmt" type="number" step=".01"></div><div><label>Payment Method</label><select id="mePayment"><option>Cash</option><option>M-Pesa</option><option>Bank</option><option>Cheque</option><option>Other</option></select></div></div><button class="primary" onclick="addMercyExpense()">Save Expense & Generate Receipt</button></div></div></div>
<div class="panel"><h2>Mercy Support Records</h2>${db.mercyIncome.length?`<h3>Contributions</h3><table><tr><th>Date</th><th>Home Cell</th><th>Contributor</th><th>Member No.</th><th>Contact</th><th>Residence</th><th>Purpose</th><th>Amount</th><th></th></tr>${db.mercyIncome.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>{let h=db.homeCells.find(q=>q.id===x.homeCellId);return `<tr><td>${esc(x.date)}</td><td>${esc(h?.name||'-')}</td><td>${esc(x.contributorName||'-')}</td><td>${esc(x.churchId||'-')}</td><td>${esc(x.contact||'-')}</td><td>${esc(x.residence||'-')}</td><td>${esc(x.category||'-')}</td><td class="green">${money(x.amount)}</td><td><button class="btn danger" onclick="delMercyTransaction('income','${x.id}')">Delete</button></td></tr>`}).join('')}</table>`:'<div class="empty">No Mercy Support contributions recorded.</div>'}${db.mercyExpenses.length?`<h3>Expenses</h3><table><tr><th>Date</th><th>Home Cell</th><th>Purpose</th><th>Payee / Recipient</th><th>Payment</th><th>Receipt</th><th>Amount</th><th></th></tr>${db.mercyExpenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>{let h=db.homeCells.find(q=>q.id===x.homeCellId);return `<tr><td>${esc(x.date)}</td><td>${esc(h?.name||'-')}</td><td>${esc(x.purpose||x.category||'-')}</td><td>${esc(x.payee||'-')}</td><td>${esc(x.payment||'-')}</td><td>${esc(x.receiptNo||'-')}</td><td class="red">${money(x.amount)}</td><td><button class="btn" onclick="printMercyReceipt('${x.id}')">Print Receipt</button> <button class="btn danger" onclick="delMercyTransaction('expense','${x.id}')">Delete</button></td></tr>`}).join('')}</table>`:'<div class="empty">No Mercy Support expenses recorded.</div>'}</div>
<div class="panel"><h2>Registered Home Cells (${db.homeCells.length})</h2>${db.homeCells.length?`<table><tr><th>Home Cell</th><th>Leader</th><th>Contact</th><th>Location</th><th>Meeting Day</th><th>Members</th><th>Mercy Balance</th><th></th></tr>${db.homeCells.map(h=>{let mi=sum(db.mercyIncome.filter(x=>x.homeCellId===h.id)),me=sum(db.mercyExpenses.filter(x=>x.homeCellId===h.id));return `<tr><td>${esc(h.name)}</td><td>${esc(h.leader)}</td><td>${esc(h.contact)}</td><td>${esc(h.location)}</td><td>${esc(h.day)}</td><td>${db.members.filter(m=>m.cell===h.name).length}</td><td>${money(mi-me)}</td><td><button class="btn" onclick="editHomeCell('${h.id}')">Edit</button> <button class="btn danger" onclick="del('homeCells','${h.id}')">Delete</button></td></tr>`}).join('')}</table>`:'<div class="empty">No home cells registered.</div>'}</div>`}
function autofillHomeLeader(){let m=db.members.find(x=>x.id===v('hleaderId'));vSet('hleader',m?.name||'');vSet('hcontact',m?.contact||'')}
function addHomeCell(){let leader=db.members.find(m=>m.id===v('hleaderId')),x={id:uid(),name:v('hname'),leaderId:leader?.id||'',leader:leader?.name||v('hleader'),contact:leader?.contact||v('hcontact'),location:v('hlocation'),day:v('hday'),description:v('hdesc')};if(!x.name)return alert('Enter the home cell name.');if(db.homeCells.some(h=>h.name.toLowerCase()===x.name.toLowerCase()))return alert('That home cell already exists.');db.homeCells.push(x);save();render()}
function editHomeCell(id){let h=db.homeCells.find(x=>x.id===id);if(!h)return;let name=prompt('Home Cell Name:',h.name);if(name===null)return;let leaderName=prompt('Leader Name:',h.leader||'');if(leaderName===null)return;let contact=prompt('Leader Contact:',h.contact||'');if(contact===null)return;let location=prompt('Meeting Location:',h.location||'');if(location===null)return;let day=prompt('Meeting Day:',h.day||'');if(day===null)return;let description=prompt('Description:',h.description||'');if(description===null)return;Object.assign(h,{name:name.trim(),leader:leaderName.trim(),contact,location,day,description});save();render()}
function filterMercyContributors(){let cell=v('miCell'),q=v('mercyPersonSearch').trim().toLowerCase(),sel=$('miMember');if(!sel)return;let members=db.members.filter(m=>m.cell===db.homeCells.find(h=>h.id===cell)?.name&&memberSearchText(m).includes(q));sel.innerHTML='<option value="">-- Select Contributor --</option>'+members.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.churchId)})</option>`).join('')+'<option value="OTHER">Other / Non-member</option>'}
function loadMercyContributors(cellId,memberId){let cell=v(cellId),sel=$(memberId);if(!sel)return;let members=db.members.filter(m=>m.cell===db.homeCells.find(h=>h.id===cell)?.name);sel.innerHTML='<option value="">-- Select Contributor --</option>'+members.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.churchId)})</option>`).join('')+'<option value="OTHER">Other / Non-member</option>';if(memberId==='miMember')autofillMercyContributor()}
function autofillMercyContributor(){let id=v('miMember'),m=db.members.find(x=>x.id===id);if(m){vSet('miName',m.name);vSet('miChurchId',m.churchId);vSet('miContact',m.contact);vSet('miResidence',m.residence)}else if(id==='OTHER'){vSet('miName','');vSet('miChurchId','Non-member');vSet('miContact','');vSet('miResidence','')}else{vSet('miName','');vSet('miChurchId','');vSet('miContact','');vSet('miResidence','')}}
function addMercyIncome(){let a=+v('miAmt'),cell=v('miCell'),member=v('miMember');if(a<=0||!cell||!v('miName').trim())return alert('Select a home cell, contributor and valid amount.');let m=db.members.find(x=>x.id===member),x={id:uid(),date:v('miDate')||today(),homeCellId:cell,contributorMemberId:m?.id||'',contributorName:v('miName').trim(),churchId:v('miChurchId').trim(),contact:v('miContact').trim(),residence:v('miResidence').trim(),category:v('miCat')||'Mercy Support Contribution',amount:a};db.mercyIncome.push(x);save();alert('Mercy Support contribution recorded for '+x.contributorName+'.');render()}
function addMercyExpense(){let a=+v('meAmt'),cell=v('meCell'),purpose=v('mePurpose').trim(),payee=v('mePayee').trim();if(a<=0||!cell||!purpose)return alert('Select a home cell, enter the expense purpose and a valid amount.');let receipt=nextNo('receipt','LSCC-MRC'),x={id:uid(),date:v('meDate')||today(),homeCellId:cell,purpose,category:'Mercy Support Expense',payee,payment:v('mePayment'),amount:a,receiptNo:receipt};db.mercyExpenses.push(x);save();render();setTimeout(()=>printMercyReceipt(x.id),50)}
function printMercyReceipt(id){let x=db.mercyExpenses.find(q=>q.id===id);if(!x)return;let h=db.homeCells.find(q=>q.id===x.homeCellId);let html=`<div style="max-width:680px;margin:auto;border:1px solid #ccc;padding:28px;font-family:Arial"><h2 style="text-align:center">${esc(db.settings.name)}</h2><h3 style="text-align:center">MERCY SUPPORT EXPENSE RECEIPT</h3><p><b>Receipt No:</b> ${esc(x.receiptNo||'-')} &nbsp; <b>Date:</b> ${esc(x.date)}</p><p><b>Home Cell:</b> ${esc(h?.name||'-')}</p><table style="width:100%;border-collapse:collapse"><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Purpose</th><td style="border:1px solid #ccc;padding:8px">${esc(x.purpose||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Payee / Recipient</th><td style="border:1px solid #ccc;padding:8px">${esc(x.payee||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Payment Method</th><td style="border:1px solid #ccc;padding:8px">${esc(x.payment||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Amount</th><td style="border:1px solid #ccc;padding:8px"><b>${money(x.amount)}</b></td></tr></table><br><p>Prepared by: ${esc(currentUser()?.name||'-')}</p><p style="margin-top:50px">Authorized Signature: __________________________</p></div>`;let w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print the receipt.');w.document.write(`<html><head><title>${esc(x.receiptNo||'Mercy Receipt')}</title></head><body>${html}</body></html>`);w.document.close();w.focus();w.print()}
function planning(){let opts=db.members.filter(m=>m.type==='Minister'||m.department==='Pastoral Team');let services=['Monday Prayer','Wednesday Midweek Service','Thursday Online Fellowship','Sunday First Service','Sunday Second Service'];return `<div class="panel"><h2>Weekly Service Planning Program</h2><div class="notice">Only Ministers or members assigned to the Pastoral Team can be selected for service planning and the Sunday Ministers' Prayer coordinator.</div><div class="form">${services.map((s,i)=>{let x=db.programs.find(p=>p.service===s)||{};return `<div class="panel"><h3>${s}</h3><label>Programmer</label><select id="prog${i}"><option value="">-- Select --</option>${opts.map(m=>`<option value="${m.id}" ${x.programmerId===m.id?'selected':''}>${esc(m.name)} (${esc(m.churchId)})</option>`).join('')}</select><label style="margin-top:8px">Preacher</label><select id="preach${i}"><option value="">-- Select --</option>${opts.map(m=>`<option value="${m.id}" ${x.preacherId===m.id?'selected':''}>${esc(m.name)} (${esc(m.churchId)})</option>`).join('')}</select><label style="margin-top:8px">Details / Theme</label><textarea id="pdet${i}">${esc(x.details||'')}</textarea></div>`}).join('')}</div><div class="panel"><h3>Sunday Ministers' Prayer</h3><label>Coordinator</label><select id="ministerPrayerCoord"><option value="">-- Select Coordinator --</option>${opts.map(m=>`<option value="${m.id}" ${db.programs.find(p=>p.service==="Sunday Ministers' Prayer")?.coordinatorId===m.id?'selected':''}>${esc(m.name)} (${esc(m.churchId)})</option>`).join('')}</select><label style="margin-top:8px">Prayer Details / Focus</label><textarea id="ministerPrayerDetails">${esc(db.programs.find(p=>p.service==="Sunday Ministers' Prayer")?.details||'')}</textarea></div><div class="actions"><button class="primary" onclick="savePlanning()">Save Weekly Program</button><button class="btn" onclick="printPlanning()">Print / Share Program</button><button class="btn" onclick="archiveCurrentWeek();alert('Current program archived.');render()">Archive This Week</button></div></div><div class="panel"><h2>Previous Weeks</h2>${db.programArchive.length?`<table><tr><th>Week</th><th>Saved At</th><th>Programs</th><th></th></tr>${db.programArchive.slice().reverse().map(a=>`<tr><td>${esc(a.week)}</td><td>${new Date(a.savedAt).toLocaleString()}</td><td>${a.programs.length}</td><td><button class="btn" onclick="viewArchive('${a.id}')">View</button></td></tr>`).join('')}</table>`:'<div class="empty">No previous weekly programs archived yet.</div>'}</div><div id="archiveOut"></div>`}
function printPlanning(){let rows=db.programs||[];let html=`<div class="panel"><h2>${esc(db.settings.name)} - Weekly Service Planning</h2><p>Week of ${esc(programWeekKey())}</p><table><tr><th>Service</th><th>Programmer / Coordinator</th><th>Preacher</th><th>Details</th></tr>${rows.map(x=>{let p=db.members.find(m=>m.id===x.programmerId),q=db.members.find(m=>m.id===x.preacherId),c=db.members.find(m=>m.id===x.coordinatorId);return `<tr><td>${esc(x.service)}</td><td>${esc((p||c)?.name||'-')}</td><td>${esc(q?.name||'-')}</td><td>${esc(x.details||'-')}</td></tr>`}).join('')}</table></div>`;let w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print/share the program.');w.document.write(`<html><head><title>Weekly Service Planning</title><style>body{font:14px Arial;padding:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px;text-align:left}th{background:#f1f5f9}</style></head><body>${html}</body></html>`);w.document.close();w.focus();w.print()}
function savePlanning(){let names=['Monday Prayer','Wednesday Midweek Service','Thursday Online Fellowship','Sunday First Service','Sunday Second Service'];let coord=v('ministerPrayerCoord'),allowed=db.members.filter(m=>m.type==='Minister'||m.department==='Pastoral Team').map(m=>m.id);if(coord&&!allowed.includes(coord))return alert('Coordinator must be a Minister or Pastoral Team member.');db.programs=names.map((service,i)=>({id:uid(),service,programmerId:v('prog'+i),preacherId:v('preach'+i),details:v('pdet'+i)}));db.programs.push({id:uid(),service:"Sunday Ministers' Prayer",coordinatorId:coord,details:v('ministerPrayerDetails')});save();alert('Weekly service program saved.');render()}
function viewArchive(id){let a=db.programArchive.find(x=>x.id===id);if(!a)return;let find=id=>db.members.find(m=>m.id===id)?.name||'-';$('archiveOut').innerHTML=`<div class="panel"><h2>Archived Week: ${esc(a.week)}</h2><table><tr><th>Service</th><th>Programmer / Coordinator</th><th>Preacher</th><th>Details</th></tr>${a.programs.map(x=>`<tr><td>${esc(x.service)}</td><td>${esc(find(x.programmerId||x.coordinatorId))}</td><td>${esc(find(x.preacherId))}</td><td>${esc(x.details||'')}</td></tr>`).join('')}</table></div>`}
function clock(){let el=$('clock');if(!el)return;let tick=()=>{let d=new Date();el.textContent=d.toLocaleDateString('en-KE',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})+' • '+d.toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});archiveProgramsIfNeeded()};tick();clearInterval(window.lsccClock);window.lsccClock=setInterval(tick,1000)}
function calendar(){let y=+(v('calYear')||new Date().getFullYear());let ev=db.events.filter(e=>+e.date.slice(0,4)===y).sort((a,b)=>a.date.localeCompare(b.date));let months=Array.from({length:12},(_,i)=>{let a=ev.filter(e=>new Date(e.date+'T00:00:00').getMonth()===i);return `<div class="calendar-day"><h4>${new Date(y,i,1).toLocaleString('en',{month:'long'})}</h4>${a.length?a.map(e=>`<div><span class="pill">${e.date.slice(8,10)}${e.time?' '+esc(e.time):''}</span> <b>${esc(e.title)}</b><div class="small">${esc(e.venue||'')} ${e.notes?'• '+esc(e.notes):''}</div></div>`).join(''):'<div class="small sub">No events</div>'}</div>`}).join('');return `<div class="panel"><h2>Church Calendar & Annual Events</h2><div class="form"><div><label>Year</label><input id="calYear" type="number" value="${y}"></div><div><label>Event Date</label><input id="evdate" type="date" value="${y}-01-01"></div><div><label>Time</label><input id="evtime" type="time"></div><div><label>Event / Program Name</label><input id="evtitle"></div><div><label>Venue</label><input id="evvenue"></div><div><label>Notes</label><input id="evnotes"></div></div><div class="actions"><button class="primary" onclick="addEvent()">Add Event</button><button class="btn" onclick="render()">Show Year</button></div></div><div class="panel"><h2>${y} Annual Calendar</h2><div class="calendar-grid">${months}</div></div><div class="panel"><h2>Event List</h2>${ev.length?`<table class="calendar-list"><tr><th>Date</th><th>Time</th><th>Event</th><th>Venue</th><th>Notes</th><th></th></tr>${ev.map(e=>`<tr><td>${e.date}</td><td>${esc(e.time||'-')}</td><td><b>${esc(e.title)}</b></td><td>${esc(e.venue||'-')}</td><td>${esc(e.notes||'-')}</td><td><button class="btn" onclick="editEvent('${e.id}')">Edit</button> <button class="btn danger" onclick="delEvent('${e.id}')">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No events recorded for this year.</div>'}</div>`}
function addEvent(){let date=v('evdate'),title=v('evtitle').trim();if(!date||!title)return alert('Event date and event name are required.');db.events.push({id:uid(),date,time:v('evtime'),title,venue:v('evvenue'),notes:v('evnotes')});save();render()}
function editEvent(id){let e=db.events.find(x=>x.id===id);if(!e)return;let date=prompt('Event date (YYYY-MM-DD):',e.date);if(date===null)return;let title=prompt('Event / Program Name:',e.title);if(title===null)return;let time=prompt('Time:',e.time||'');if(time===null)return;let venue=prompt('Venue:',e.venue||'');if(venue===null)return;let notes=prompt('Notes:',e.notes||'');if(notes===null)return;Object.assign(e,{date,title:title.trim(),time,venue,notes});save();render()}

function eligibleLeaders(){return db.members.filter(m=>['Minister','Pastor','Elder'].includes(m.type))}
function special(){let leaders=eligibleLeaders();let selected=v('sdSelect')||db.specialDepartments[0]?.id||'';let d=db.specialDepartments.find(x=>x.id===selected);let sm=d?db.specialMembers.filter(x=>x.departmentId===d.id):[];let si=d?db.specialIncome.filter(x=>x.departmentId===d.id):[],se=d?db.specialExpenses.filter(x=>x.departmentId===d.id):[];return `<div class="panel"><h2>Special Departments</h2><div class="notice">These departments have their own membership and finances. Their income and expenses are kept completely separate from the main church income and expense accounts.</div><div class="form"><div><label>Department Name</label><input id="sdname" placeholder="e.g. School Ministry"></div><div><label>Leader</label><select id="sdleader" onchange="autofillLeaderContact()"><option value="">-- Select Minister / Pastor / Elder --</option>${leaders.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.type)})</option>`).join('')}</select></div><div><label>Contact</label><input id="sdcontact"></div><div><label>Meeting Day</label><input id="sdday"></div><div><label>Meeting Time</label><input id="sdtime" type="time"></div><div><label>Purpose / Description</label><input id="sddesc"></div></div><div class="actions"><button class="primary" onclick="addSpecialDepartment()">Create Special Department</button></div></div><div class="panel"><h2>Registered Special Departments (${db.specialDepartments.length})</h2>${db.specialDepartments.length?`<table><tr><th>Department</th><th>Leader</th><th>Contact</th><th>Meeting</th><th>Members</th><th>Income</th><th>Expenses</th><th>Balance</th><th></th></tr>${db.specialDepartments.map(x=>{let l=db.members.find(m=>m.id===x.leaderId),mi=db.specialMembers.filter(a=>a.departmentId===x.id).length,inc=sum(db.specialIncome.filter(a=>a.departmentId===x.id)),ex=sum(db.specialExpenses.filter(a=>a.departmentId===x.id));return `<tr><td><b>${esc(x.name)}</b><div class="sub">${esc(x.description||'')}</div></td><td>${esc(l?.name||'-')}</td><td>${esc(x.contact||'-')}</td><td>${esc(x.day||'-')} ${esc(x.time||'')}</td><td>${mi}</td><td class="green">${money(inc)}</td><td class="red">${money(ex)}</td><td>${money(inc-ex)}</td><td><button class="btn" onclick="editSpecialDepartment('${x.id}')">Edit</button> <button class="btn" onclick="goSpecial('${x.id}')">Manage</button> <button class="btn danger" onclick="delSpecial('${x.id}')">Delete</button></td></tr>`}).join('')}</table>`:'<div class="empty">No special departments created.</div>'}</div>${d?specialManage(d,sm,si,se):''}`}
function editSpecialDepartment(id){let d=db.specialDepartments.find(x=>x.id===id);if(!d)return;let name=prompt('Department Name:',d.name);if(name===null)return;let leader=db.members.filter(m=>['Minister','Pastor','Elder'].includes(m.type));let leaderName=prompt('Leader Name:',db.members.find(m=>m.id===d.leaderId)?.name||d.name);if(leaderName===null)return;let found=leader.find(m=>m.name.toLowerCase()===leaderName.toLowerCase());if(!found)return alert('Leader must be a Minister, Pastor or Elder from the main church database.');let contact=prompt('Leader Contact:',found?.contact||d.contact||'');if(contact===null)return;let day=prompt('Meeting Day:',d.day||'');if(day===null)return;let time=prompt('Meeting Time:',d.time||'');if(time===null)return;let description=prompt('Purpose / Description:',d.description||'');if(description===null)return;Object.assign(d,{name:name.trim(),leaderId:found?.id||d.leaderId,contact,day,time,description});save();render()}

function addSpecialDepartment(){let name=v('sdname').trim(),leader=v('sdleader');if(!name||!leader)return alert('Department name and an eligible leader are required.');if(!eligibleLeaders().some(m=>m.id===leader))return alert('Leader must be a Minister, Pastor or Elder.');if(db.specialDepartments.some(d=>d.name.toLowerCase()===name.toLowerCase()))return alert('That department already exists.');db.specialDepartments.push({id:uid(),name,leaderId:leader,contact:v('sdcontact'),day:v('sdday'),time:v('sdtime'),description:v('sddesc')});save();render()}

function specialManage(d,sm,si,se){window._activeSpecialDepartmentId=d.id;let main=db.members;let inc=sum(si),ex=sum(se);return `<div class="panel"><h2>Manage: ${esc(d.name)}</h2><p class="sub">Leader: ${esc(db.members.find(m=>m.id===d.leaderId)?.name||'-')} • Separate accounts</p><select id="sdSelect" onchange="specialRefresh()"><option value="">-- Select Department --</option>${db.specialDepartments.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="cards" style="margin-top:12px"><div class="card"><div class="label">MEMBERS</div><div class="value">${sm.length}</div></div><div class="card"><div class="label">DEPARTMENT INCOME</div><div class="value green">${money(inc)}</div></div><div class="card"><div class="label">DEPARTMENT EXPENSES</div><div class="value red">${money(ex)}</div></div><div class="card"><div class="label">DEPARTMENT BALANCE</div><div class="value">${money(inc-ex)}</div></div></div><div class="grid"><div class="panel"><h3>Add Department Members</h3><div class="notice">Choose an existing church member to auto-add them, or enter a person manually. These records belong only to this special department.</div><label>Find Main Member (Name, ID or Membership Number)</label><input id="specialMemberSearch" placeholder="Type name, ID or LSCC number" oninput="filterSpecialMembers()"><label>Auto-select from Main Church Database (prefills the boxes below)</label><select id="autoMember" onchange="prefillSpecialMember()"><option value="">-- Select Main Member --</option>${main.filter(m=>!sm.some(x=>x.memberId===m.id)).map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.churchId)})</option>`).join('')}</select><div class="actions"></div><hr><div class="form"><div><label>Manual Name</label><input id="smmname"></div><div><label>Contact</label><input id="smmcontact"></div><div><label>ID / Reference</label><input id="smmid"></div><div><label>Role in Department</label><select id="smmrole"><option>Member</option><option>Leader</option></select></div><div id="parentFields" style="display:${d.name.toLowerCase().includes('school')?'block':'none'}"><label>Parent / Guardian Name</label><input id="smmparent"></div><div id="parentContactField" style="display:${d.name.toLowerCase().includes('school')?'block':'none'}"><label>Parent / Guardian Contact</label><input id="smmparentcontact"></div></div><div class="actions"><button class="primary" onclick="saveSpecialMember('${d.id}')">Save Department Member</button><button class="btn" onclick="clearSpecialMemberForm()">Clear</button></div></div><div class="panel"><h3>Department Member List</h3>${sm.length?`<table><tr><th>Name</th><th>Contact</th><th>Main Church ID</th><th>Role</th><th>Parent / Guardian</th><th>Parent Contact</th><th>Source</th><th></th></tr>${sm.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.contact||'-')}</td><td>${esc(x.memberId?db.members.find(m=>m.id===x.memberId)?.churchId||'-':x.reference||'-')}</td><td>${esc(x.role||'Member')}</td><td>${esc(x.parentName||'-')}</td><td>${esc(x.parentContact||'-')}</td><td>${x.memberId?'Main Church':'Manual'}</td><td><button class="btn danger" onclick="delSpecialMember('${x.id}')">Remove</button></td></tr>`).join('')}</table>`:'<div class="empty">No department members.</div>'}</div></div><div class="grid"><div class="panel"><h3>Department Income</h3><div class="form"><div><label>Date</label><input id="siDate" type="date" value="${today()}"></div><div><label>Source / Category</label><input id="siCat" placeholder="e.g. Contributions"></div><div><label>Amount</label><input id="siAmt" type="number" step=".01"></div><div><label>Reference</label><input id="siRef"></div><div style="grid-column:1/-1"><label>Notes</label><textarea id="siNotes"></textarea></div></div><button class="primary" onclick="addSpecialIncome('${d.id}')">Save Department Income</button><table style="margin-top:12px"><tr><th>Date</th><th>Category</th><th>Amount</th><th>Reference</th><th></th></tr>${si.map(x=>`<tr><td>${x.date}</td><td>${esc(x.category)}</td><td class="green">${money(x.amount)}</td><td>${esc(x.ref||'-')}</td><td><button class="btn danger" onclick="delSpecialFinance('income','${x.id}')">Delete</button></td></tr>`).join('')}</table></div><div class="panel"><h3>Department Expenses</h3><div class="form"><div><label>Date</label><input id="seDate" type="date" value="${today()}"></div><div><label>Category</label><input id="seCat" placeholder="e.g. Transport"></div><div><label>Amount</label><input id="seAmt" type="number" step=".01"></div><div><label>Payee</label><input id="sePayee"></div><div style="grid-column:1/-1"><label>Notes</label><textarea id="seNotes"></textarea></div></div><button class="primary" onclick="addSpecialExpense('${d.id}')">Save Department Expense</button><table style="margin-top:12px"><tr><th>Date</th><th>Category</th><th>Amount</th><th>Payee</th><th></th></tr>${se.map(x=>`<tr><td>${x.date}</td><td>${esc(x.category)}</td><td class="red">${money(x.amount)}</td><td>${esc(x.payee||'-')}</td><td><button class="btn danger" onclick="delSpecialFinance('expense','${x.id}')">Delete</button></td></tr>`).join('')}</table></div></div>`}
function specialRefresh(){let id=v('sdSelect');if(!id){render();return}let old=location.hash;location.hash='special';$('view').innerHTML=special();let sel=$('sdSelect');if(sel)sel.value=id}
function filterSpecialMembers(){let q=v('specialMemberSearch').trim().toLowerCase(),sel=$('autoMember'),selectedDeptId=window._activeSpecialDepartmentId,sm=db.specialMembers.filter(x=>x.departmentId===selectedDeptId);if(!sel)return;let cur=sel.value;sel.innerHTML='<option value="">-- Select Main Member --</option>'+db.members.filter(m=>!sm.some(x=>x.memberId===m.id)&&memberSearchText(m).includes(q)).map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.churchId)})</option>`).join('');if([...sel.options].some(o=>o.value===cur))sel.value=cur}

function delSpecialFinance(type,id){let key=type==='income'?'specialIncome':'specialExpenses',ledger=type==='income'?'Special Department Income':'Special Department Expenses',record=db[key].find(x=>x.id===id);if(!record)return alert('Transaction was not found.');let reason=prompt('Enter the reason for deleting this transaction:','');if(reason===null||!reason.trim())return alert('A deletion reason is required.');if(!confirm('Delete this department transaction and record it in Transaction Management?'))return;db.counters.audit=(db.counters.audit||0)+1;let d=db.specialDepartments.find(x=>x.id===record.departmentId);db.deletedTransactions.push({id:uid(),auditId:'AUD-'+String(db.counters.audit).padStart(5,'0'),deletedAt:new Date().toISOString(),username:currentUser()?.username||'-',userName:currentUser()?.name||'-',ledger,transactionDate:record.date||'',name:record.payee||d?.name||'',reference:record.ref||'',amount:+record.amount||0,reason:reason.trim(),record:{...record}});db[key]=db[key].filter(x=>x.id!==id);save();reloadDatabase();render()}
function reports(){return `<div class="panel"><h2>Financial Reports</h2><div class="form"><div><label>From</label><input id="rf" type="date"></div><div><label>To</label><input id="rt" type="date" value="${today()}"></div></div><div class="actions"><button class="primary" onclick="report('income')">Generate Income Report</button><button class="btn" onclick="report('expense')">Generate Expense Report</button><button class="btn" onclick="report('both')">Generate Income & Expense Report</button></div><div id="ro" style="margin-top:16px"></div></div><div class="panel"><h2>Trial Balance</h2><div class="notice">Trial balances keep Main Church, Projects, Special Departments, Home Cells/Mercy Ministry and the complete church portfolio separately identifiable.</div><div class="form"><div><label>From</label><input id="tbf" type="date"></div><div><label>To</label><input id="tbt" type="date" value="${today()}"></div><div><label>Account / Scope</label><select id="tbscope"><option value="main">Main Church</option>${db.specialDepartments.map(d=>`<option value="special:${d.id}">Special Department — ${esc(d.name)}</option>`).join('')}<option value="homecells">Home Cells / Mercy Ministry</option><option value="mercy">Mercy Ministry</option><option value="portfolio">Entire Church Portfolio — All Sources</option></select></div></div><div class="actions"><button class="primary" onclick="trialBalance()">Generate Trial Balance</button></div><div id="tbro" style="margin-top:16px"></div></div><div class="panel"><h2>Non-Financial Reports</h2><div class="actions"><button class="btn" onclick="memberReport()">Member Database</button><button class="btn" onclick="partnerReport()">Partners List</button><button class="btn" onclick="weeklyProgramReport()">Previous Weekly Programs</button><button class="btn" onclick="homecellReport()">Home Cell Membership</button><button class="btn" onclick="mercyReport()">Mercy Ministry by Home Cell</button><button class="btn" onclick="projectReport()">Project Performance</button></div><div id="nro" style="margin-top:16px"></div></div><div class="panel"><h2>Special Department Financial Reports</h2><div class="form"><div><label>Department</label><select id="srepd"><option value="">-- All Departments --</option>${db.specialDepartments.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div><div><label>From</label><input id="srf" type="date"></div><div><label>To</label><input id="srt" type="date" value="${today()}"></div></div><div class="actions"><button class="primary" onclick="specialFinanceReport()">Generate Department Report</button></div><div id="sro" style="margin-top:16px"></div></div>`}
function trialBalance(){let f=v('tbf'),t=v('tbt'),scope=v('tbscope')||'main',inRange=x=>(!f||x.date>=f)&&(!t||x.date<=t),rows=[],label='';const income=(account,amount)=>{amount=+amount||0;if(amount)rows.push({account,debit:0,credit:amount})},expense=(account,amount)=>{amount=+amount||0;if(amount)rows.push({account,debit:amount,credit:0})};const general=db.income.filter(x=>(x.incomeGroup||'General')==='General'&&!x.projectId&&inRange(x));const project=db.income.filter(x=>(x.incomeGroup==='Project'||x.projectId)&&inRange(x));const mainExpenses=db.expenses.filter(x=>x.financeGroup!=='Mercy Ministry'&&inRange(x));const mercyI=db.mercyIncome.filter(inRange),mercyE=db.mercyExpenses.filter(inRange);if(scope==='main'){label='Main Church';income('Opening Balance',+(db.settings.openingBalance||0));[...new Set(general.map(x=>x.category))].forEach(c=>income(c,sum(general.filter(x=>x.category===c))));[...new Set(mainExpenses.map(x=>x.category))].forEach(c=>expense(c,sum(mainExpenses.filter(x=>x.category===c))))}else if(scope==='portfolio'){label='Entire Church Portfolio — All Sources';income('Main Church Opening Balance',+(db.settings.openingBalance||0));[...new Set(general.map(x=>x.category))].forEach(c=>income('Main Church — '+c,sum(general.filter(x=>x.category===c))));[...new Set(project.map(x=>x.projectId||'Other Project Contributions'))].forEach(pid=>{let p=db.projects.find(q=>q.id===pid);income('Project — '+(p?.name||'Other Project Contributions'),sum(project.filter(x=>(x.projectId||'')===pid)))});db.specialDepartments.forEach(d=>{let si=db.specialIncome.filter(x=>x.departmentId===d.id&&inRange(x)),se=db.specialExpenses.filter(x=>x.departmentId===d.id&&inRange(x));income(d.name+' Income',sum(si));expense(d.name+' Expenses',sum(se))});db.homeCells.forEach(h=>{let mi=sum(mercyI.filter(x=>x.homeCellId===h.id)),me=sum(mercyE.filter(x=>x.homeCellId===h.id));if(mi)income('Home Cell — '+h.name+' Mercy Contributions',mi);if(me)expense('Home Cell — '+h.name+' Mercy Expenses',me)});[...new Set(mainExpenses.map(x=>x.category))].forEach(c=>expense('Main Church — '+c,sum(mainExpenses.filter(x=>x.category===c))))}else if(scope==='mercy'||scope==='homecells'){label=scope==='mercy'?'Mercy Ministry':'Home Cells / Mercy Ministry';db.homeCells.forEach(h=>{let mi=sum(mercyI.filter(x=>x.homeCellId===h.id)),me=sum(mercyE.filter(x=>x.homeCellId===h.id));if(mi)income(h.name+' Contributions',mi);if(me)expense(h.name+' Expenses',me)});if(!db.homeCells.length){income('Mercy Contributions',sum(mercyI));[...new Set(mercyE.map(x=>x.category))].forEach(c=>expense(c,sum(mercyE.filter(x=>x.category===c))))}}else if(scope.startsWith('special:')){let id=scope.split(':')[1],d=db.specialDepartments.find(x=>x.id===id);label='Special Department — '+(d?.name||'Unknown');let si=db.specialIncome.filter(x=>x.departmentId===id&&inRange(x)),se=db.specialExpenses.filter(x=>x.departmentId===id&&inRange(x));[...new Set(si.map(x=>x.category))].forEach(c=>income(c,sum(si.filter(x=>x.category===c))));[...new Set(se.map(x=>x.category))].forEach(c=>expense(c,sum(se.filter(x=>x.category===c))))}let debit=sum(rows.map(x=>x.debit)),credit=sum(rows.map(x=>x.credit)),balance=credit-debit;if(balance>0)rows.push({account:'Current Surplus / Credit Balance',debit:balance,credit:0});else if(balance<0)rows.push({account:'Current Deficit / Debit Balance',debit:0,credit:-balance});let td=sum(rows.map(x=>x.debit)),tc=sum(rows.map(x=>x.credit));let html=`<p><b>Scope:</b> ${esc(label)} &nbsp; <b>Period:</b> ${esc(f||'Beginning')} to ${esc(t||'Present')}</p><table><tr><th>#</th><th>Account</th><th>Debit</th><th>Credit</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.account)}</td><td>${money(r.debit)}</td><td>${money(r.credit)}</td></tr>`).join('')}<tr><th></th><th>Total</th><th>${money(td)}</th><th>${money(tc)}</th></tr></table><p><b>Status:</b> ${Math.abs(td-tc)<0.01?'Balanced':'Difference '+money(Math.abs(td-tc))}</p>`;showRequestedReport('tbro','Trial Balance — '+label,html)}

function specialFinanceReport(){let id=v('srepd'),f=v('srf'),t=v('srt'),deps=id?[db.specialDepartments.find(d=>d.id===id)].filter(Boolean):db.specialDepartments.slice();if(!deps.length)return showRequestedReport('sro','Special Department Financial Report','<div class="empty">No special departments are registered.</div>');let blocks=deps.map(d=>{let si=db.specialIncome.filter(x=>x.departmentId===d.id&&(!f||x.date>=f)&&(!t||x.date<=t)),se=db.specialExpenses.filter(x=>x.departmentId===d.id&&(!f||x.date>=f)&&(!t||x.date<=t)),inc=sum(si),ex=sum(se);return `<div><h3>${esc(d.name)}</h3><p><b>Income:</b> ${money(inc)} &nbsp; <b>Expenses:</b> ${money(ex)} &nbsp; <b>Balance:</b> ${money(inc-ex)}</p><div class="grid"><div><h4>Income</h4><table><tr><th>Date</th><th>Category</th><th>Reference</th><th>Amount</th></tr>${si.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.category||'Other')}</td><td>${esc(x.ref||'-')}</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="4">No income records.</td></tr>'}</table></div><div><h4>Expenses</h4><table><tr><th>Date</th><th>Category</th><th>Payee</th><th>Amount</th></tr>${se.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.category||'Other')}</td><td>${esc(x.payee||'-')}</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="4">No expense records.</td></tr>'}</table></div></div></div>`}).join('');showRequestedReport('sro','Special Department Financial Report',`<p><b>Period:</b> ${esc(f||'Beginning')} to ${esc(t||'Present')}</p>${blocks}`)}
function report(kind='both'){let f=v('rf'),t=v('rt'),i=db.income.filter(x=>(x.incomeGroup||'General')==='General'&&(!f||x.date>=f)&&(!t||x.date<=t)),e=db.expenses.filter(x=>x.financeGroup!=='Mercy Ministry'&&(!f||x.date>=f)&&(!t||x.date<=t));let incCats=[...new Set(i.map(x=>x.category))],expCats=[...new Set(e.map(x=>x.category))];let inc=`<h3>Income Breakdown</h3><table><tr><th>Category</th><th>Total</th></tr>${incCats.map(c=>`<tr><td>${esc(c)}</td><td>${money(sum(i.filter(x=>x.category===c)))}</td></tr>`).join('')}<tr><th>Total Income</th><th>${money(sum(i))}</th></tr></table>`;let exp=`<h3>Expense Breakdown</h3><table><tr><th>Category</th><th>Total</th></tr>${expCats.map(c=>`<tr><td>${esc(c)}</td><td>${money(sum(e.filter(x=>x.category===c)))}</td></tr>`).join('')}<tr><th>Total Expenses</th><th>${money(sum(e))}</th></tr></table>`;let html=kind==='income'?inc:kind==='expense'?exp:inc+exp+`<h3>Net Movement</h3><p><b>${money(sum(i)-sum(e))}</b></p>`;showRequestedReport('ro',(kind==='income'?'Income':kind==='expense'?'Expense':'Income & Expense')+' Report',html)}
function showRequestedReport(container,title,html){$(container).innerHTML=`<div id="requestedReport" class="panel"><h2>${title}</h2>${html}</div><div class="actions no-print"><button class="primary" onclick="printRequested('requestedReport','${esc(title)}')">Print Requested Report</button><button class="btn" onclick="pdfRequested('requestedReport','${esc(title)}')">Export as PDF</button></div>`}
function printRequested(id,title){let el=$(id);if(!el)return;let w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print the requested report.');w.document.write(`<html><head><title>${esc(title)}</title><style>body{font:12px Arial;padding:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:7px;text-align:left}th{background:#f1f5f9}</style></head><body>${el.innerHTML}</body></html>`);w.document.close();w.focus();w.print()}
function pdfRequested(id,title){alert('Choose "Save as PDF" or "Microsoft Print to PDF" in the print dialog.');printRequested(id,title)}
function memberReport(){let ms=db.members.slice().sort((a,b)=>a.name.localeCompare(b.name));showRequestedReport('nro','Member Database Report',`<p>${ms.length} members</p><table><tr><th>#</th><th>Membership No.</th><th>Name</th><th>ID</th><th>Contact</th><th>Residence</th><th>Gender</th><th>Marital Status</th><th>Home Cell</th><th>Member Category</th><th>Department</th></tr>${ms.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.churchId)}</td><td>${esc(m.name)}</td><td>${esc(m.idNo||'-')}</td><td>${esc(m.contact||'-')}</td><td>${esc(m.residence||'-')}</td><td>${esc(m.gender||'-')}</td><td>${esc(m.maritalStatus||'-')}</td><td>${esc(m.cell||'-')}</td><td>${esc(m.type||'-')}</td><td>${esc(m.department||'-')}</td></tr>`).join('')}</table>`)}
function partnerReport(){let rows=db.partners||[];showRequestedReport('nro','Project Partners Report',`<div><h3>Project Partners (${rows.length})</h3><table><tr><th>#</th><th>Name</th><th>ID</th><th>Contact</th><th>Member Status</th><th>Linked Member</th><th>Total Contributions</th></tr>${rows.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${esc(p.idNo||'-')}</td><td>${esc(p.contact||'-')}</td><td>${esc(p.kind||p.type||'-')}</td><td>${esc(db.members.find(m=>m.id===p.memberId)?.name||'-')}</td><td>${money(sum(db.income.filter(x=>x.incomeGroup==='Project'&&x.partnerId===p.id)))}</td></tr>`).join('')}</table></div>`)}
function weeklyProgramReport(){let rows=db.programArchive.slice().sort((a,b)=>b.week.localeCompare(a.week));let html=rows.length?rows.map(a=>`<div><h3>Week of ${esc(a.week)}</h3><table><tr><th>Service</th><th>Programmer / Coordinator</th><th>Preacher</th><th>Details</th></tr>${a.programs.map(x=>{let p=db.members.find(m=>m.id===x.programmerId),q=db.members.find(m=>m.id===x.preacherId),c=db.members.find(m=>m.id===x.coordinatorId);return `<tr><td>${esc(x.service)}</td><td>${esc((p||c)?.name||'-')}</td><td>${esc(q?.name||'-')}</td><td>${esc(x.details||'-')}</td></tr>`}).join('')}</table></div>`).join(''):'<div class="empty">No previous weekly programs archived.</div>';showRequestedReport('nro','Previous Weekly Programs Report',html)}
function homecellReport(){let rows=db.homeCells.map(h=>({cell:h.name,leader:h.leader,members:db.members.filter(m=>m.cell===h.name)}));let html=rows.length?rows.map(r=>`<div><h3>${esc(r.cell)}</h3><p>Leader: ${esc(r.leader||'-')} • Members: ${r.members.length}</p>${r.members.length?`<table><tr><th>#</th><th>Membership No.</th><th>Name</th><th>Contact</th><th>Residence</th><th>Gender</th><th>Member Category</th><th>Department</th></tr>${r.members.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.churchId)}</td><td>${esc(m.name)}</td><td>${esc(m.contact)}</td><td>${esc(m.residence)}</td><td>${esc(m.gender||'-')}</td><td>${esc(m.type)}</td><td>${esc(m.department||'-')}</td></tr>`).join('')}</table>`:'<div class="empty">No members assigned.</div>'}</div>`).join(''):'<div class="empty">No home cells registered.</div>';showRequestedReport('nro','Home Cell Membership Report',html)}
function delMercyTransaction(type,id){let key=type==='income'?'mercyIncome':'mercyExpenses',record=db[key].find(x=>x.id===id);if(!record)return alert('Transaction was not found.');let reason=prompt('Enter the reason for deleting this transaction:','');if(reason===null||!reason.trim())return alert('A deletion reason is required.');if(!confirm('Delete this Mercy Ministry transaction and record it in Transaction Management?'))return;db.counters.audit=(db.counters.audit||0)+1;let h=db.homeCells.find(x=>x.id===record.homeCellId);db.deletedTransactions.push({id:uid(),auditId:'AUD-'+String(db.counters.audit).padStart(5,'0'),deletedAt:new Date().toISOString(),username:currentUser()?.username||'-',userName:currentUser()?.name||'-',ledger:type==='income'?'Mercy Ministry Contributions':'Mercy Ministry Expenses',transactionDate:record.date||'',name:record.contributorName||record.payee||h?.name||'',reference:record.ref||record.receiptNo||'',amount:+record.amount||0,reason:reason.trim(),record:{...record}});db[key]=db[key].filter(x=>x.id!==id);save();reloadDatabase();render()}
function exportDeletedTransactions(){let h=['Audit ID','Deleted At','Username','Ledger','Transaction Date','Name / Payee','Reference','Amount','Reason'];let r=db.deletedTransactions.map(x=>[x.auditId,x.deletedAt,x.username,x.ledger,x.transactionDate,x.name,x.reference,x.amount,x.reason]);let s=[h,...r].map(a=>a.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\\n'),b=new Blob([s],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='LSCC-Deleted-Transaction-Audit.csv';a.click()}
function mercyReport(){let rows=db.homeCells.map(h=>{let inc=sum(db.mercyIncome.filter(x=>x.homeCellId===h.id)),ex=sum(db.mercyExpenses.filter(x=>x.homeCellId===h.id));return {h,inc,ex,b:inc-ex}});let html=`<h3>Mercy Ministry Records by Home Cell</h3><table><tr><th>Home Cell</th><th>Leader</th><th>Contributions</th><th>Expenses</th><th>Balance</th></tr>${rows.map(r=>`<tr><td>${esc(r.h.name)}</td><td>${esc(r.h.leader||'-')}</td><td>${money(r.inc)}</td><td>${money(r.ex)}</td><td>${money(r.b)}</td></tr>`).join('')}</table><h4>Detailed Records</h4>${rows.map(r=>`<h4>${esc(r.h.name)}</h4><table><tr><th>Date</th><th>Type</th><th>Contributor / Payee</th><th>Member No.</th><th>Contact</th><th>Purpose / Category</th><th>Receipt</th><th>Amount</th></tr>${db.mercyIncome.filter(x=>x.homeCellId===r.h.id).map(x=>`<tr><td>${esc(x.date)}</td><td>Contribution</td><td>${esc(x.contributorName||'-')}</td><td>${esc(x.churchId||'-')}</td><td>${esc(x.contact||'-')}</td><td>${esc(x.category||'-')}</td><td>-</td><td>${money(x.amount)}</td></tr>`).join('')}${db.mercyExpenses.filter(x=>x.homeCellId===r.h.id).map(x=>`<tr><td>${esc(x.date)}</td><td>Expense</td><td>${esc(x.payee||'-')}</td><td>-</td><td>-</td><td>${esc(x.purpose||x.category||'-')}</td><td>${esc(x.receiptNo||'-')}</td><td>${money(x.amount)}</td></tr>`).join('')}</table>`).join('')}`;showRequestedReport('nro','Mercy Ministry Report',html)}
function projectReport(){let target=+(db.settings.partnerTarget||0),projectI=db.income.filter(x=>x.incomeGroup==='Project'),months={};projectI.forEach(x=>{let m=x.date?.slice(0,7);if(m)months[m]=(months[m]||0)+(+x.amount||0)});let ms=Object.entries(months).sort();let max=Math.max(1,...ms.map(x=>x[1]));let w=760,h=280,pad=45;let pts=ms.map((x,i)=>{let xx=pad+(i*(w-pad*2)/Math.max(1,ms.length-1)),yy=h-pad-(x[1]/max)*(h-pad*2);return `${xx},${yy}`}).join(' ');let partnerRows=db.partners.map(p=>{let c=sum(projectI.filter(x=>x.partnerId===p.id)),pct=target?c/target*100:0;return {p,c,pct}}).sort((a,b)=>b.pct-a.pct).slice(0,5);let consistency=db.partners.map(p=>{let rows=projectI.filter(x=>x.partnerId===p.id),months=new Set(rows.map(x=>x.date?.slice(0,7)).filter(Boolean));return {p,count:months.size,total:sum(rows)}}).sort((a,b)=>b.count-a.count||b.total-a.total).slice(0,5);let html=`<h3>Project Contribution Trajectory</h3><svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;border:1px solid #e5e7eb;background:#fff"><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#94a3b8"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="#94a3b8"/>${pts?`<polyline points="${pts}" fill="none" stroke="#2563eb" stroke-width="3"/>`:''}${ms.map((x,i)=>{let xx=pad+(i*(w-pad*2)/Math.max(1,ms.length-1)),yy=h-pad-(x[1]/max)*(h-pad*2);return `<circle cx="${xx}" cy="${yy}" r="4" fill="#2563eb"/><text x="${xx}" y="${h-12}" text-anchor="middle" font-size="10">${x[0]}</text>`}).join('')}</svg><h3>Other Project Contributors</h3><p><b>${money(sum(projectI.filter(x=>x.otherPartner||x.otherMember)))}</b> recorded under Other. These are excluded from the registered-partner rankings.</p><h3>Top 5 Partners by Target Performance</h3><p class="sub">Target per partner: ${money(target)}</p><table><tr><th>#</th><th>Partner</th><th>Contribution</th><th>Target</th><th>Achievement</th></tr>${partnerRows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.p.name)}</td><td>${money(r.c)}</td><td>${money(target)}</td><td>${r.pct.toFixed(1)}%</td></tr>`).join('')}</table><h3>Top 5 Most Consistent Partners</h3><table><tr><th>#</th><th>Partner</th><th>Contribution Months</th><th>Total Contribution</th></tr>${consistency.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.p.name)}</td><td>${r.count}</td><td>${money(r.total)}</td></tr>`).join('')}</table>`;showRequestedReport('nro','Project Performance Report',html)}

function office(){let rows=db.officeSchedule.slice().sort((a,b)=>(a.date+' '+a.time).localeCompare(b.date+' '+b.time));let table=rows.length?'<table><tr><th>Date</th><th>Time</th><th>Type</th><th>Engagement</th><th>Person / Organization</th><th>Venue</th><th>Priority</th><th>Status</th><th></th></tr>'+rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.time||'-')}</td><td>${esc(x.type)}</td><td><b>${esc(x.title)}</b><div class="sub">${esc(x.notes||'')}</div></td><td>${esc(x.person||'-')}<br>${esc(x.contact||'')}</td><td>${esc(x.venue||'-')}</td><td>${esc(x.priority)}</td><td>${esc(x.status)}</td><td><button class="btn" onclick="editOfficeItem('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteOfficeItem('${x.id}')">Delete</button></td></tr>`).join('')+'</table>':'<div class="empty">No Apostle Office engagements scheduled.</div>';return `<div class="panel"><h2>Apostle's Office — Appointments, Meetings & Functions</h2><div class="notice">Schedule engagements to be attended or managed by the Apostle's Office. Items remain separate from church financial records.</div><div class="form"><div><label>Type</label><select id="oaType"><option>Appointment</option><option>Meeting</option><option>Function</option></select></div><div><label>Date</label><input id="oaDate" type="date" value="${today()}"></div><div><label>Time</label><input id="oaTime" type="time"></div><div><label>Title / Engagement</label><input id="oaTitle" placeholder="e.g. Leadership meeting"></div><div><label>Person / Organization</label><input id="oaPerson"></div><div><label>Contact</label><input id="oaContact"></div><div><label>Venue</label><input id="oaVenue"></div><div><label>Priority</label><select id="oaPriority"><option>Normal</option><option>High</option><option>Urgent</option></select></div><div><label>Status</label><select id="oaStatus"><option>Scheduled</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select></div><div style="grid-column:1/-1"><label>Notes / Agenda</label><textarea id="oaNotes"></textarea></div></div><div class="actions"><button class="primary" onclick="addOfficeItem()">Schedule Engagement</button></div></div><div class="panel"><h2>Office Schedule</h2>${table}</div>`}
function addOfficeItem(){if(!requireCan('office'))return;let title=v('oaTitle').trim(),date=v('oaDate');if(!title||!date)return alert('Enter the engagement title and date.');db.officeSchedule.push({id:uid(),type:v('oaType'),date,time:v('oaTime'),title,person:v('oaPerson'),contact:v('oaContact'),venue:v('oaVenue'),priority:v('oaPriority'),status:v('oaStatus'),notes:v('oaNotes'),createdBy:currentUser()?.id||''});save();render()}
function editOfficeItem(id){let x=db.officeSchedule.find(q=>q.id===id);if(!x)return;let title=prompt('Engagement title:',x.title);if(title===null)return;let date=prompt('Date (YYYY-MM-DD):',x.date);if(date===null)return;let status=prompt('Status (Scheduled/Confirmed/Completed/Cancelled):',x.status);if(status===null)return;x.title=title.trim()||x.title;x.date=date.trim()||x.date;x.status=status.trim()||x.status;save();render()}
function deleteOfficeItem(id){if(!requireCan('office'))return;if(!confirm('Delete this office schedule item?'))return;db.officeSchedule=db.officeSchedule.filter(x=>x.id!==id);save();reloadDatabase();render()}
function addIncomeType(){let x=v('newIncomeType').trim();if(!x)return alert('Enter an income type.');if(db.incomeTypes.some(a=>a.toLowerCase()===x.toLowerCase()))return alert('That income type already exists.');db.incomeTypes.push(x);save();render()}
function removeIncomeType(i){if(i<0||i>=db.incomeTypes.length)return;let x=db.incomeTypes[i];if(!confirm(`Remove income type "${x}" from Settings? Existing transactions are preserved.`))return;db.incomeTypes.splice(i,1);save();render()}
function addExpenseType(){let x=v('newExpenseType').trim();if(!x)return alert('Enter an expense type.');if(db.expenseTypes.some(a=>a.toLowerCase()===x.toLowerCase()))return alert('That expense type already exists.');db.expenseTypes.push(x);save();render()}
function removeExpenseType(i){if(i<0||i>=db.expenseTypes.length)return;let x=db.expenseTypes[i];if(!confirm(`Remove expense type "${x}" from Settings? Existing transactions are preserved.`))return;db.expenseTypes.splice(i,1);save();render()}

function settings(){return `<div class="panel"><h2>Settings & Backup</h2><div class="form2"><div><label>Church Name</label><input id="sn" value="${esc(db.settings.name)}"></div><div><label>Currency</label><input id="sc" value="${esc(db.settings.currency)}"></div><div><label>Partner Target Amount</label><input id="spt" type="number" step=".01" value="${+(db.settings.partnerTarget||0)}"><div class="sub">Applies to every registered project partner.</div></div><div><label>Opening Balance</label><input id="sob" type="number" step=".01" value="${+(db.settings.openingBalance||0)}"><div class="sub">Existing funds; excluded from income reports and pie chart.</div></div></div><div class="form2"><div><label>Cloud Server URL</label><input id="serverUrlInput" value="${esc(serverUrl())}" placeholder="http://192.168.1.10:4785"><div class="sub">Use the HTTPS cloud address on every computer, phone or tablet.</div></div><div class="actions" style="margin-top:20px"><button class="primary" onclick="saveServerUrl()">Save Cloud URL</button><button class="btn" onclick="syncNow()">Sync Now</button></div></div><div class="actions"><button class="primary" onclick="set()">Save</button><button class="btn" onclick="backup()">Backup JSON</button><button class="btn" onclick="restore()">Restore JSON</button><button class="btn danger" onclick="reset()">Reset All Data</button></div></div>
<div class="grid"><div class="panel"><h2>Customize Income Types</h2><div class="form2"><div><label>New Income Type</label><input id="newIncomeType"></div><div class="actions" style="margin-top:20px"><button class="primary" onclick="addIncomeType()">Add</button></div></div>
<table style="margin-top:12px"><tr><th>Income Type</th><th></th></tr>${db.incomeTypes.map((x,i)=>`<tr><td>${esc(x)}</td><td><button class="btn danger" onclick="removeIncomeType(${i})">Remove</button></td></tr>`).join('')}</table></div>
<div class="panel"><h2>Customize Expense Types</h2><div class="form2"><div><label>New Expense Type</label><input id="newExpenseType"></div><div class="actions" style="margin-top:20px"><button class="primary" onclick="addExpenseType()">Add</button></div></div>
<table style="margin-top:12px"><tr><th>Expense Type</th><th></th></tr>${db.expenseTypes.map((x,i)=>`<tr><td>${esc(x)}</td><td><button class="btn danger" onclick="removeExpenseType(${i})">Remove</button></td></tr>`).join('')}</table></div></div><div class="panel"><h2>User Restrictions & Permissions</h2><div class="notice">Create restrictions for each user by selecting the sections they are allowed to access. Administrators always retain full access.</div>${db.users.map(u=>`<div style="border:1px solid #e5e7eb;border-radius:8px;padding:12px;margin:10px 0"><b>${esc(u.name)}</b> <span class="sub">(${esc(u.username)} • ${esc(u.role)})</span><div class="form" style="margin-top:10px">${allModules.map(m=>{let checked=u.role==='Administrator'||!Array.isArray(u.permissions)||u.permissions.includes(m);return `<label style="font-weight:600"><input type="checkbox" id="perm_${u.id}_${m}" ${checked?'checked':''} ${u.role==='Administrator'?'disabled':''}> ${esc(m==='office'?"Apostle's Office":m.replace(/^./,c=>c.toUpperCase()))}</label>`}).join('')}</div>${u.role!=='Administrator'?`<button class="primary" onclick="saveUserPermissions('${u.id}')">Save Restrictions</button>`:'<div class="sub">Full unrestricted access</div>'}</div>`).join('')}</div>
<div class="panel"><h2>User Accounts</h2><div class="notice">Create login credentials for staff. Passwords are stored as SHA-256 hashes in this local application.</div><div class="form"><div><label>Username</label><input id="unew"></div><div><label>Display Name</label><input id="nnew"></div><div><label>Role</label><select id="rnew"><option>Administrator</option><option>Treasurer</option><option>Auditor</option><option>Secretary</option><option>Apostle</option><option>Reverend</option></select></div><div><label>Email Address</label><input id="enew" type="email" placeholder="user@example.com"></div><div><label>Temporary Password</label><input id="pnew" type="password"></div></div><div class="actions"><button class="primary" onclick="addUser()">Create User</button></div><table style="margin-top:12px"><tr><th>Username</th><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr>${db.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${esc(u.email||'-')}</td><td>${esc(u.role)}</td><td><button class="btn" onclick="editUser('${u.id}')">Edit Details</button> <button class="btn" onclick="changeUserPassword('${u.id}')">Change Password</button> ${u.id==='u-admin'?'<span class="sub">Default Administrator</span>':'<button class="btn danger" onclick="removeUser(\'${u.id}\')">Remove</button>'}</td></tr>`).join('')}</table></div>`}
function saveUserPermissions(id){let u=db.users.find(x=>x.id===id);if(!u||u.role==='Administrator')return;u.permissions=allModules.filter(m=>$('perm_'+id+'_'+m)?.checked);save();alert('User restrictions saved.');render()}
async function addUser(){if(currentUser()?.role!=='Administrator')return alert('Only an Administrator can create users.');let username=v('unew').trim(),name=v('nnew').trim(),role=v('rnew'),email=v('enew').trim().toLowerCase(),pw=v('pnew');if(!username||!name||!pw)return alert('Enter username, display name and password.');if(db.users.some(u=>u.username.toLowerCase()===username.toLowerCase()))return alert('Username already exists.');if(!email)return alert('Email address is required for user accounts.');if(db.users.some(u=>(u.email||'').toLowerCase()===email))return alert('That email is already registered.');if(!['Administrator','Treasurer','Auditor','Secretary','Apostle','Reverend'].includes(role))return alert('Select a valid role.');db.users.push({id:uid(),username,name,email,role,passwordHash:await hashPassword(pw),permissions:allModules.slice()});save();alert('User created.');render()}
async function editUser(id){if(currentUser()?.role!=='Administrator')return alert('Only an Administrator can edit user details.');let u=db.users.find(x=>x.id===id);if(!u)return;let name=prompt('Display name:',u.name);if(name===null)return;let username=prompt('Username:',u.username);if(username===null)return;let email=prompt('Email address:',u.email||'');if(email===null)return;let role=prompt('Role (Administrator/Treasurer/Auditor/Secretary/Apostle/Reverend):',u.role);if(role===null)return;name=name.trim();username=username.trim();email=email.trim().toLowerCase();role=role.trim();if(!name||!username||!email||!role)return alert('Name, username, email and role cannot be blank.');if(db.users.some(x=>x.id!==id&&x.username.toLowerCase()===username.toLowerCase()))return alert('That username already exists.');if(db.users.some(x=>x.id!==id&&(x.email||'').toLowerCase()===email))return alert('That email is already registered.');if(!['Administrator','Treasurer','Auditor','Secretary','Apostle','Reverend'].includes(role))return alert('Invalid role.');u.name=name;u.username=username;u.email=email;u.role=role;save();alert('User details updated.');render()}
async function changeUserPassword(id){let me=currentUser();if(!me)return;let u=db.users.find(x=>x.id===id);if(!u)return;if(me.role!=='Administrator'&&me.id!==id)return alert('Only an Administrator can change another user password.');let p=prompt('Enter the new password for '+u.username+':');if(p===null)return;if(p.length<6)return alert('Password must be at least 6 characters.');let confirmPw=prompt('Confirm the new password:');if(confirmPw!==p)return alert('Passwords do not match.');u.passwordHash=await hashPassword(p);save();alert('Password changed successfully.');if(me.id===id){sessionStorage.removeItem('lsccCurrentUser');showLogin()}}
async function forgotPassword(){let email=prompt('Enter your registered email address:');if(email===null)return;email=email.trim().toLowerCase();let u=db.users.find(x=>(x.email||'').toLowerCase()===email);if(!u)return alert('No user account is registered with that email address.');let p=prompt('Email verified for '+u.name+'. Enter a new password (minimum 6 characters):');if(p===null)return;if(p.length<6)return alert('Password must be at least 6 characters.');let c=prompt('Confirm the new password:');if(c!==p)return alert('Passwords do not match.');u.passwordHash=await hashPassword(p);save();alert('Password reset successfully. You can now sign in with your new password.')}
function removeUser(id){if(currentUser()?.role!=='Administrator')return alert('Only an Administrator can remove users.');if(id==='u-admin')return alert('The default administrator cannot be removed.');if(db.users.length<=1)return alert('At least one user must remain.');if(confirm('Remove this user?')){db.users=db.users.filter(u=>u.id!==id);save();render()}}
function saveServerUrl(){let u=v('serverUrlInput').trim().replace(/\/$/,'');if(!/^https?:\/\//i.test(u))return alert('Enter a valid cloud URL, for example https://your-domain.example');localStorage.setItem(SERVER_KEY,u);alert('Cloud server URL saved.');syncNow()}
function set(){db.settings.name=v('sn')||'LSCC Finance Manager';db.settings.currency=v('sc')||'KSh';db.settings.openingBalance=+(v('sob')||0);db.settings.partnerTarget=+(v('spt')||0);save();render()}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='LSCC-Finance-Backup-'+today()+'.json';a.click()}
function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render()}catch(e){alert('Invalid backup')}};r.readAsText(i.files[0])};i.click()}
function reset(){if(confirm('Delete all records?')){localStorage.removeItem(K);db=JSON.parse(JSON.stringify(D));centralRevision=0;localStorage.setItem('lsccCentralRevision','0');localSave();queueSync();render()}}
function del(type,x){
if(!Array.isArray(db[type]))return alert('The selected record type is unavailable.');
let transactionLedger={income:'Main / Project Income',expenses:'Main Church Expenses'};
let isTxn=!!transactionLedger[type];
let reason=isTxn?prompt('Enter the reason for deleting this transaction:',''):'';
if(isTxn&&(reason===null||!reason.trim()))return alert('A deletion reason is required.');
if(!confirm(isTxn?'Delete this transaction and record it in Transaction Management?':'Delete this record? This cannot be undone.'))return;
let record=db[type].find(a=>a.id===x);if(!record)return alert('The selected record was not found.');
if(isTxn){db.counters.audit=(db.counters.audit||0)+1;db.deletedTransactions.push({id:uid(),auditId:'AUD-'+String(db.counters.audit).padStart(5,'0'),deletedAt:new Date().toISOString(),username:currentUser()?.username||'-',userName:currentUser()?.name||'-',ledger:transactionLedger[type],transactionDate:record.date||'',name:record.memberId?(db.members.find(m=>m.id===record.memberId)?.name||''):record.payee||record.otherMember||record.otherPartner||'',reference:record.ref||record.receiptNo||record.voucherNo||'',amount:+record.amount||0,reason:reason.trim(),record:{...record}})}
db[type]=db[type].filter(a=>a.id!==x);
if(type==='projects') db.income=db.income.filter(a=>a.projectId!==x);
if(type==='partners') db.income=db.income.map(a=>a.partnerId===x?{...a,partnerId:'',otherPartner:true}:a);
if(type==='homeCells'){db.mercyIncome=db.mercyIncome.filter(a=>a.homeCellId!==x);db.mercyExpenses=db.mercyExpenses.filter(a=>a.homeCellId!==x)}
save();reloadDatabase();render();
}
function csv(){let a=[...db.income.map(x=>({...x,t:'Income'})),...db.expenses.map(x=>({...x,t:'Expense'}))],h=['Date','Type','Category','Amount','Payment','Reference','Project','Partner','Member'];let r=a.map(x=>[x.date,x.t,x.category||x.description||'',x.amount,x.payment||'',x.ref||'',db.projects.find(p=>p.id===x.projectId)?.name||'',db.partners.find(p=>p.id===x.partnerId)?.name||'',db.members.find(m=>m.id===x.memberId)?.name||'']);let s=[h,...r].map(a=>a.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\\n'),b=new Blob([s],{type:'text/csv'}),a1=document.createElement('a');a1.href=URL.createObjectURL(b);a1.download='LSCC-Finance-Transactions.csv';a1.click()}
function pie(){let o={};db.income.filter(x=>(x.incomeGroup||'General')==='General').forEach(x=>{let m=x.date?.slice(0,7);if(m)o[m]=(o[m]||0)+(+x.amount||0)});let a=Object.entries(o).sort(),tot=sum(a.map(x=>({amount:x[1]}))),cols=['#2563eb','#16a34a','#f59e0b','#7c3aed','#db2777','#0891b2','#ea580c','#4f46e5'];let p=$('pie'),l=$('legend');if(!p)return;if(!a.length){p.style.background='#e5e7eb';l.innerHTML='<div class="empty">No income data.</div>';return}let cur=0,parts=[];a.forEach((x,i)=>{let q=x[1]/tot*100;parts.push(`${cols[i%cols.length]} ${cur}% ${cur+q}%`);cur+=q});p.style.background=`conic-gradient(${parts.join(',')})`;l.innerHTML=a.map((x,i)=>`<div><span><i class="dot" style="background:${cols[i%cols.length]}"></i>${x[0]}</span><b>${money(x[1])}</b></div>`).join('')}
addEventListener('hashchange',render);render();
</script></body></html>
