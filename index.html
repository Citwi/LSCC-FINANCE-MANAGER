function autofillLeaderContact(){let m=db.members.find(x=>x.id===v('sdleader'));vSet('sdcontact',m?.contact||'')}
function addSpecialDepartment(){let name=v('sdname').trim(),leader=v('sdleader');if(!name||!leader)return alert('Department name and an eligible leader are required.');if(!eligibleLeaders().some(m=>m.id===leader))return alert('Leader must be a Minister, Pastor or Elder.');if(db.specialDepartments.some(d=>d.name.toLowerCase()===name.toLowerCase()))return alert('That department already exists.');db.specialDepartments.push({id:uid(),name,leaderId:leader,contact:v('sdcontact'),day:v('sdday'),time:v('sdtime'),description:v('sddesc')});save();render()}
function delSpecial(id){if(!confirm('Delete this special department and all of its separate records?'))return;db.specialDepartments=db.specialDepartments.filter(x=>x.id!==id);db.specialMembers=db.specialMembers.filter(x=>x.departmentId!==id);db.specialIncome=db.specialIncome.filter(x=>x.departmentId!==id);db.specialExpenses=db.specialExpenses.filter(x=>x.departmentId!==id);save();reloadDatabase();render()}
function specialManage(d,sm,si,se){window._activeSpecialDepartmentId=d.id;let main=db.members;let inc=sum(si),ex=sum(se);return `<div class="panel"><h2>Manage: ${esc(d.name)}</h2><p class="sub">Leader: ${esc(db.members.find(m=>m.id===d.leaderId)?.name||'-')} • Separate accounts</p><select id="sdSelect" onchange="specialRefresh()"><option value="">-- Select Department --</option>${db.specialDepartments.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="cards" style="margin-top:12px"><div class="card"><div class="label">MEMBERS</div><div class="value">${sm.length}</div></div><div class="card"><div class="label">DEPARTMENT INCOME</div><div class="value green">${money(inc)}</div></div><div class="card"><div class="label">DEPARTMENT EXPENSES</div><div class="value red">${money(ex)}</div></div><div class="card"><div class="label">DEPARTMENT BALANCE</div><div class="value">${money(inc-ex)}</div></div></div><div class="grid"><div class="panel"><h3>Add Department Members</h3><div class="notice">Choose an existing church member to auto-add them, or enter a person manually. These records belong only to this special department.</div><label>Find Main Member (Name, ID or Membership Number)</label><input id="specialMemberSearch" placeholder="Type name, ID or LSCC number" oninput="filterSpecialMembers()"><label>Auto-select from Main Church Database (prefills the boxes below)</label><select id="autoMember" onchange="prefillSpecialMember()"><option value="">-- Select Main Member --</option>${main.filter(m=>!sm.some(x=>x.memberId===m.id)).map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.churchId)})</option>`).join('')}</select><div class="actions"></div><hr><div class="form"><div><label>Member Name</label><input id="smmname" class="readonly" readonly></div><div><label>Contact</label><input id="smmcontact" class="readonly" readonly></div><div><label>Membership Number</label><input id="smmid" class="readonly" readonly></div><div><label>Residence</label><input id="smmresidence" class="readonly" readonly></div><div><label>Role in Department</label><select id="smmrole"><option>Member</option><option>Leader</option></select></div><div id="parentFields" style="display:none"><label>Parent / Guardian Name</label><input id="smmparent"></div><div id="parentContactField" style="display:none"><label>Parent / Guardian Contact</label><input id="smmparentcontact"></div></div><div class="actions"><button class="primary" onclick="saveSpecialMember('${d.id}')">Save Department Member</button><button class="btn" onclick="clearSpecialMemberForm()">Clear</button></div></div><div class="panel"><h3>Department Member List</h3>${sm.length?`<table><tr><th>Name</th><th>Contact</th><th>Main Church ID</th><th>Role</th><th>Parent / Guardian</th><th>Parent Contact</th><th>Source</th><th></th></tr>${sm.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.contact||'-')}</td><td>${esc(x.memberId?db.members.find(m=>m.id===x.memberId)?.churchId||'-':x.reference||'-')}</td><td>${esc(x.role||'Member')}</td><td>${esc(x.parentName||'-')}</td><td>${esc(x.parentContact||'-')}</td><td>${x.memberId?'Main Church':'Manual'}</td><td><button class="btn" onclick="editSpecialMember('${x.id}')">Edit</button> <button class="btn danger" onclick="delSpecialMember('${x.id}')">Remove</button></td></tr>`).join('')}</table>`:'<div class="empty">No department members.</div>'}</div></div><div class="grid"><div class="panel"><h3>Department Income</h3><div class="form"><div><label>Date</label><input id="siDate" type="date" value="${today()}"></div><div><label>Source / Category</label><input id="siCat" placeholder="e.g. Contributions"></div><div><label>Amount</label><input id="siAmt" type="number" step=".01"></div><div><label>Reference</label><input id="siRef"></div><div style="grid-column:1/-1"><label>Notes</label><textarea id="siNotes"></textarea></div></div><button class="primary" onclick="addSpecialIncome('${d.id}')">Save Department Income</button><table style="margin-top:12px"><tr><th>Date</th><th>Category</th><th>Amount</th><th>Reference</th><th></th></tr>${si.map(x=>`<tr><td>${x.date}</td><td>${esc(x.category)}</td><td class="green">${money(x.amount)}</td><td>${esc(x.ref||'-')}</td><td><button class="btn danger" onclick="delSpecialFinance('income','${x.id}')">Delete</button></td></tr>`).join('')}</table></div><div class="panel"><h3>Department Expenses</h3><div class="form"><div><label>Date</label><input id="seDate" type="date" value="${today()}"></div><div><label>Category</label><input id="seCat" placeholder="e.g. Transport"></div><div><label>Amount</label><input id="seAmt" type="number" step=".01"></div><div><label>Payee</label><input id="sePayee"></div><div style="grid-column:1/-1"><label>Notes</label><textarea id="seNotes"></textarea></div></div><button class="primary" onclick="addSpecialExpense('${d.id}')">Save Department Expense</button><table style="margin-top:12px"><tr><th>Date</th><th>Category</th><th>Amount</th><th>Payee</th><th></th></tr>${se.map(x=>`<tr><td>${x.date}</td><td>${esc(x.category)}</td><td class="red">${money(x.amount)}</td><td>${esc(x.payee||'-')}</td><td><button class="btn danger" onclick="delSpecialFinance('expense','${x.id}')">Delete</button></td></tr>`).join('')}</table></div></div>`}
function specialRefresh(){let id=v('sdSelect');if(!id){render();return}let old=location.hash;location.hash='special';$('view').innerHTML=special();let sel=$('sdSelect');if(sel)sel.value=id}
function filterSpecialMembers(){let q=v('specialMemberSearch').trim().toLowerCase(),sel=$('autoMember'),selectedDeptId=window._activeSpecialDepartmentId,sm=db.specialMembers.filter(x=>x.departmentId===selectedDeptId);if(!sel)return;let cur=sel.value;sel.innerHTML='<option value="">-- Select Main Member --</option>'+db.members.filter(m=>!sm.some(x=>x.memberId===m.id)&&memberSearchText(m).includes(q)).map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.churchId)})</option>`).join('');if([...sel.options].some(o=>o.value===cur))sel.value=cur}
function prefillSpecialMember(){let m=db.members.find(x=>x.id===v('autoMember'));if(!m)return;vSet('smmname',m.name);vSet('smmcontact',m.contact);vSet('smmid',m.churchId);vSet('smmresidence',m.residence);window._specialLoadedMemberId=m.id;let show=String(m.type||'').toLowerCase()==='sunday school';let a=$('parentFields'),b=$('parentContactField');if(a)a.style.display=show?'block':'none';if(b)b.style.display=show?'block':'none'}
function vSet(id,val){let x=$(id);if(x)x.value=val||''}
function clearSpecialMemberForm(){['smmname','smmcontact','smmid','smmresidence','smmparent','smmparentcontact'].forEach(id=>vSet(id,''));let a=$('parentFields'),b=$('parentContactField');if(a)a.style.display='none';if(b)b.style.display='none';vSet('autoMember','');window._specialLoadedMemberId='';window._editingSpecialMemberId='';render()}
function editSpecialMember(id){let x=db.specialMembers.find(q=>q.id===id);if(!x)return;window._editingSpecialMemberId=id;window._specialLoadedMemberId=x.memberId||'';let sel=$('autoMember');if(sel)sel.value=x.memberId||'';prefillSpecialMember();vSet('smmrole',x.role||'Member');vSet('smmparent',x.parentName||'');vSet('smmparentcontact',x.parentContact||'');let btn=document.querySelector('button[onclick^="saveSpecialMember("]');if(btn)btn.textContent='Save Changes';let clear=document.querySelector('button[onclick="clearSpecialMemberForm()"]');if(clear)clear.textContent='Cancel'}
function saveSpecialMember(did){let loadedMember=window._specialLoadedMemberId||v('autoMember'),m=loadedMember?db.members.find(x=>x.id===loadedMember):null,isSchool=String(m?.type||'').toLowerCase()==='sunday school',name=v('smmname').trim();if(!name)return alert('Enter or auto-select a member name.');let loaded=window._specialLoadedMemberId||v('autoMember');let editing=window._editingSpecialMemberId?db.specialMembers.find(x=>x.id===window._editingSpecialMemberId):null;if(loaded&&db.specialMembers.some(x=>x.id!==editing?.id&&x.departmentId===did&&x.memberId===loaded))return alert('That member is already in this department.');let data={departmentId:did,memberId:loaded||'',name,contact:v('smmcontact'),reference:v('smmid'),role:v('smmrole')||'Member',residence:v('smmresidence'),parentName:isSchool?v('smmparent'):'',parentContact:isSchool?v('smmparentcontact'):''};if(editing)Object.assign(editing,data);else db.specialMembers.push({id:uid(),...data});save();window._specialLoadedMemberId='';window._editingSpecialMemberId='';render()}
function addSpecialMemberAuto(did){let id=v('autoMember'),m=db.members.find(x=>x.id===id),d=db.specialDepartments.find(x=>x.id===did);if(!m)return alert('Select a main church member.');if(db.specialMembers.some(x=>x.departmentId===did&&x.memberId===id))return alert('Member is already in this department.');let isSchool=String(m.type||'').toLowerCase()==='sunday school';db.specialMembers.push({id:uid(),departmentId:did,memberId:m.id,name:m.name,contact:m.contact,residence:m.residence,role:v('smmrole')||'Member',parentName:isSchool?v('smmparent'):'',parentContact:isSchool?v('smmparentcontact'):''});save();render()}
function addSpecialMemberManual(did){let name=v('smmname').trim();if(!name)return alert('Manual member name is required.');let d=db.specialDepartments.find(x=>x.id===did),isSchool=d&&d.name.toLowerCase().includes('school');db.specialMembers.push({id:uid(),departmentId:did,memberId:null,name,contact:v('smmcontact'),reference:v('smmid'),role:v('smmrole')||'Member',residence:v('smmresidence'),parentName:isSchool?v('smmparent'):'',parentContact:isSchool?v('smmparentcontact'):''});save();render()}
function delSpecialMember(id){if(!confirm('Remove this department member?'))return;db.specialMembers=db.specialMembers.filter(x=>x.id!==id);save();reloadDatabase();render()}
function addSpecialIncome(did){let amt=+v('siAmt');if(!amt||amt<=0)return alert('Enter a valid amount.');db.specialIncome.push({id:uid(),departmentId:did,date:v('siDate')||today(),category:v('siCat')||'Other',amount:amt,ref:v('siRef'),notes:v('siNotes')});save();render()}
function addSpecialExpense(did){let amt=+v('seAmt');if(!amt||amt<=0)return alert('Enter a valid amount.');db.specialExpenses.push({id:uid(),departmentId:did,date:v('seDate')||today(),category:v('seCat')||'Other',amount:amt,payee:v('sePayee'),notes:v('seNotes')});save();render()}
function delSpecialFinance(type,id){let key=type==='income'?'specialIncome':'specialExpenses',ledger=type==='income'?'Special Department Income':'Special Department Expenses',record=db[key].find(x=>x.id===id);if(!record)return alert('Transaction was not found.');let reason=prompt('Enter the reason for deleting this transaction:','');if(reason===null||!reason.trim())return alert('A deletion reason is required.');if(!confirm('Delete this department transaction and record it in Transaction Management?'))return;db.counters.audit=(db.counters.audit||0)+1;let d=db.specialDepartments.find(x=>x.id===record.departmentId);db.deletedTransactions.push({id:uid(),auditId:'AUD-'+String(db.counters.audit).padStart(5,'0'),deletedAt:new Date().toISOString(),username:currentUser()?.username||'-',userName:currentUser()?.name||'-',ledger,transactionDate:record.date||'',name:record.payee||d?.name||'',reference:record.ref||'',amount:+record.amount||0,reason:reason.trim(),record:{...record}});db[key]=db[key].filter(x=>x.id!==id);save();reloadDatabase();render()}
function reports(){return `<div class="panel"><h2>Financial Reports</h2><div class="form"><div><label>From</label><input id="rf" type="date"></div><div><label>To</label><input id="rt" type="date" value="${today()}"></div></div><div class="actions"><button class="primary" onclick="report('income')">Generate Income Report</button><button class="btn" onclick="report('expense')">Generate Expense Report</button><button class="btn" onclick="report('both')">Generate Income & Expense Report</button></div><div id="ro" style="margin-top:16px"></div></div><div class="panel"><h2>Trial Balance</h2><div class="notice">Trial balances keep Main Church, Projects, Special Departments, Home Cells/Mercy Ministry and the complete church portfolio separately identifiable.</div><div class="form"><div><label>From</label><input id="tbf" type="date"></div><div><label>To</label><input id="tbt" type="date" value="${today()}"></div><div><label>Account / Scope</label><select id="tbscope"><option value="main">Main Church</option>${db.specialDepartments.map(d=>`<option value="special:${d.id}">Special Department — ${esc(d.name)}</option>`).join('')}<option value="homecells">Home Cells / Mercy Ministry</option><option value="mercy">Mercy Ministry</option><option value="portfolio">Entire Church Portfolio — All Sources</option></select></div></div><div class="actions"><button class="primary" onclick="trialBalance()">Generate Trial Balance</button></div><div id="tbro" style="margin-top:16px"></div></div><div class="panel"><h2>Non-Financial Reports</h2><div class="actions"><button class="btn" onclick="memberReport()">Member Database</button><button class="btn" onclick="partnerReport()">Partners List</button><button class="btn" onclick="weeklyProgramReport()">Previous Weekly Programs</button><button class="btn" onclick="homecellReport()">Home Cell Membership</button><button class="btn" onclick="mercyReport()">Mercy Ministry by Home Cell</button><button class="btn" onclick="projectReport()">Project Performance</button></div><div id="nro" style="margin-top:16px"></div></div><div class="panel"><h2>Special Department Financial Reports</h2><div class="form"><div><label>Department</label><select id="srepd"><option value="">-- All Departments --</option>${db.specialDepartments.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div><div><label>From</label><input id="srf" type="date"></div><div><label>To</label><input id="srt" type="date" value="${today()}"></div></div><div class="actions"><button class="primary" onclick="specialFinanceReport()">Generate Department Report</button></div><div id="sro" style="margin-top:16px"></div></div>`}
function trialBalance(){let f=v('tbf'),t=v('tbt'),scope=v('tbscope')||'main',inRange=x=>(!f||x.date>=f)&&(!t||x.date<=t),rows=[],label='';const income=(account,amount)=>{amount=+amount||0;if(amount)rows.push({account,debit:0,credit:amount})},expense=(account,amount)=>{amount=+amount||0;if(amount)rows.push({account,debit:amount,credit:0})};const general=db.income.filter(x=>(x.incomeGroup||'General')==='General'&&!x.projectId&&inRange(x));const project=db.income.filter(x=>(x.incomeGroup==='Project'||x.projectId)&&inRange(x));const mainExpenses=db.expenses.filter(x=>x.financeGroup!=='Mercy Ministry'&&inRange(x));const mercyI=db.mercyIncome.filter(inRange),mercyE=db.mercyExpenses.filter(inRange);if(scope==='main'){label='Main Church';income('Opening Balance',+(db.settings.openingBalance||0));[...new Set(general.map(x=>x.category))].forEach(c=>income(c,sum(general.filter(x=>x.category===c))));[...new Set(mainExpenses.map(x=>x.category))].forEach(c=>expense(c,sum(mainExpenses.filter(x=>x.category===c))))}else if(scope==='portfolio'){label='Entire Church Portfolio — All Sources';income('Main Church Opening Balance',+(db.settings.openingBalance||0));[...new Set(general.map(x=>x.category))].forEach(c=>income('Main Church — '+c,sum(general.filter(x=>x.category===c))));[...new Set(project.map(x=>x.projectId||'Other Project Contributions'))].forEach(pid=>{let p=db.projects.find(q=>q.id===pid);income('Project — '+(p?.name||'Other Project Contributions'),sum(project.filter(x=>(x.projectId||'')===pid)))});db.specialDepartments.forEach(d=>{let si=db.specialIncome.filter(x=>x.departmentId===d.id&&inRange(x)),se=db.specialExpenses.filter(x=>x.departmentId===d.id&&inRange(x));income(d.name+' Income',sum(si));expense(d.name+' Expenses',sum(se))});db.homeCells.forEach(h=>{let mi=sum(mercyI.filter(x=>x.homeCellId===h.id)),me=sum(mercyE.filter(x=>x.homeCellId===h.id));if(mi)income('Home Cell — '+h.name+' Mercy Contributions',mi);if(me)expense('Home Cell — '+h.name+' Mercy Expenses',me)});[...new Set(mainExpenses.map(x=>x.category))].forEach(c=>expense('Main Church — '+c,sum(mainExpenses.filter(x=>x.category===c))))}else if(scope==='mercy'||scope==='homecells'){label=scope==='mercy'?'Mercy Ministry':'Home Cells / Mercy Ministry';db.homeCells.forEach(h=>{let mi=sum(mercyI.filter(x=>x.homeCellId===h.id)),me=sum(mercyE.filter(x=>x.homeCellId===h.id));if(mi)income(h.name+' Contributions',mi);if(me)expense(h.name+' Expenses',me)});if(!db.homeCells.length){income('Mercy Contributions',sum(mercyI));[...new Set(mercyE.map(x=>x.category))].forEach(c=>expense(c,sum(mercyE.filter(x=>x.category===c))))}}else if(scope.startsWith('special:')){let id=scope.split(':')[1],d=db.specialDepartments.find(x=>x.id===id);label='Special Department — '+(d?.name||'Unknown');let si=db.specialIncome.filter(x=>x.departmentId===id&&inRange(x)),se=db.specialExpenses.filter(x=>x.departmentId===id&&inRange(x));[...new Set(si.map(x=>x.category))].forEach(c=>income(c,sum(si.filter(x=>x.category===c))));[...new Set(se.map(x=>x.category))].forEach(c=>expense(c,sum(se.filter(x=>x.category===c))))}let debit=sum(rows.map(x=>x.debit)),credit=sum(rows.map(x=>x.credit)),balance=credit-debit;if(balance>0)rows.push({account:'Current Surplus / Credit Balance',debit:balance,credit:0});else if(balance<0)rows.push({account:'Current Deficit / Debit Balance',debit:0,credit:-balance});let td=sum(rows.map(x=>x.debit)),tc=sum(rows.map(x=>x.credit));let html=`<p><b>Scope:</b> ${esc(label)} &nbsp; <b>Period:</b> ${esc(f||'Beginning')} to ${esc(t||'Present')}</p><table><tr><th>#</th><th>Account</th><th>Debit</th><th>Credit</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.account)}</td><td>${money(r.debit)}</td><td>${money(r.credit)}</td></tr>`).join('')}<tr><th></th><th>Total</th><th>${money(td)}</th><th>${money(tc)}</th></tr></table><p><b>Status:</b> ${Math.abs(td-tc)<0.01?'Balanced':'Difference '+money(Math.abs(td-tc))}</p>`;showRequestedReport('tbro','Trial Balance — '+label,html)}

function specialFinanceReport(){let id=v('srepd'),f=v('srf'),t=v('srt'),deps=id?[db.specialDepartments.find(d=>d.id===id)].filter(Boolean):db.specialDepartments.slice();if(!deps.length)return showRequestedReport('sro','Special Department Financial Report','<div class="empty">No special departments are registered.</div>');let blocks=deps.map(d=>{let si=db.specialIncome.filter(x=>x.departmentId===d.id&&(!f||x.date>=f)&&(!t||x.date<=t)),se=db.specialExpenses.filter(x=>x.departmentId===d.id&&(!f||x.date>=f)&&(!t||x.date<=t)),inc=sum(si),ex=sum(se);return `<div><h3>${esc(d.name)}</h3><p><b>Income:</b> ${money(inc)} &nbsp; <b>Expenses:</b> ${money(ex)} &nbsp; <b>Balance:</b> ${money(inc-ex)}</p><div class="grid"><div><h4>Income</h4><table><tr><th>Date</th><th>Category</th><th>Reference</th><th>Amount</th></tr>${si.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.category||'Other')}</td><td>${esc(x.ref||'-')}</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="4">No income records.</td></tr>'}</table></div><div><h4>Expenses</h4><table><tr><th>Date</th><th>Category</th><th>Payee</th><th>Amount</th></tr>${se.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.category||'Other')}</td><td>${esc(x.payee||'-')}</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="4">No expense records.</td></tr>'}</table></div></div></div>`}).join('');showRequestedReport('sro','Special Department Financial Report',`<p><b>Period:</b> ${esc(f||'Beginning')} to ${esc(t||'Present')}</p>${blocks}`)}
function report(kind='both'){let f=v('rf'),t=v('rt'),i=db.income.filter(x=>(x.incomeGroup||'General')==='General'&&(!f||x.date>=f)&&(!t||x.date<=t)),e=db.expenses.filter(x=>x.financeGroup!=='Mercy Ministry'&&(!f||x.date>=f)&&(!t||x.date<=t));let incCats=[...new Set(i.map(x=>x.category))],expCats=[...new Set(e.map(x=>x.category))];let inc=`<h3>Income Breakdown</h3><table><tr><th>Category</th><th>Total</th></tr>${incCats.map(c=>`<tr><td>${esc(c)}</td><td>${money(sum(i.filter(x=>x.category===c)))}</td></tr>`).join('')}<tr><th>Total Income</th><th>${money(sum(i))}</th></tr></table>`;let exp=`<h3>Expense Breakdown</h3><table><tr><th>Category</th><th>Total</th></tr>${expCats.map(c=>`<tr><td>${esc(c)}</td><td>${money(sum(e.filter(x=>x.category===c)))}</td></tr>`).join('')}<tr><th>Total Expenses</th><th>${money(sum(e))}</th></tr></table>`;let html=kind==='income'?inc:kind==='expense'?exp:inc+exp+`<h3>Net Movement</h3><p><b>${money(sum(i)-sum(e))}</b></p>`;showRequestedReport('ro',(kind==='income'?'Income':kind==='expense'?'Expense':'Income & Expense')+' Report',html)}
function showRequestedReport(container,title,html){$(container).innerHTML=`<div id="requestedReport" class="panel"><h2>${title}</h2>${html}</div><div class="actions no-print"><button class="primary" onclick="printRequested('requestedReport','${esc(title)}')">Print Requested Report</button><button class="btn" onclick="pdfRequested('requestedReport','${esc(title)}')">Export as PDF</button></div>`}
function printRequested(id,title){let el=$(id);if(!el)return;let w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print the requested report.');w.document.write(`<html><head><title>${esc(title)}</title><style>body{font:12px Arial;padding:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:7px;text-align:left}th{background:#f1f5f9}.loginheadline{font-weight:800;color:#2563eb;margin:4px 0 16px;animation:lsccHeadline 3s ease-in-out infinite alternate}@keyframes lsccHeadline{from{opacity:.55;transform:translateX(-4px)}to{opacity:1;transform:translateX(4px)}}.readonly{background:#f8fafc}</style></head><body>${el.innerHTML}</body></html>`);w.document.close();w.focus();w.print()}
function pdfRequested(id,title){alert('Choose "Save as PDF" or "Microsoft Print to PDF" in the print dialog.');printRequested(id,title)}
function memberReport(){let ms=db.members.slice().sort((a,b)=>a.name.localeCompare(b.name));showRequestedReport('nro','Member Database Report',`<p>${ms.length} members</p><table><tr><th>#</th><th>Membership No.</th><th>Name</th><th>ID</th><th>Contact</th><th>Residence</th><th>Gender</th><th>Marital Status</th><th>Home Cell</th><th>Member Category</th><th>Department</th></tr>${ms.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.churchId)}</td><td>${esc(m.name)}</td><td>${esc(m.idNo||'-')}</td><td>${esc(m.contact||'-')}</td><td>${esc(m.residence||'-')}</td><td>${esc(m.gender||'-')}</td><td>${esc(m.maritalStatus||'-')}</td><td>${esc(m.cell||'-')}</td><td>${esc(m.type||'-')}</td><td>${esc(m.department||'-')}</td></tr>`).join('')}</table>`)}
function partnerReport(){let rows=db.partners||[];showRequestedReport('nro','Project Partners Report',`<div><h3>Project Partners (${rows.length})</h3><table><tr><th>#</th><th>Name</th><th>ID</th><th>Contact</th><th>Member Status</th><th>Linked Member</th><th>Total Contributions</th></tr>${rows.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${esc(p.idNo||'-')}</td><td>${esc(p.contact||'-')}</td><td>${esc(p.kind||p.type||'-')}</td><td>${esc(db.members.find(m=>m.id===p.memberId)?.name||'-')}</td><td>${money(sum(db.income.filter(x=>x.incomeGroup==='Project'&&x.partnerId===p.id)))}</td></tr>`).join('')}</table></div>`)}
function weeklyProgramReport(){let rows=db.programArchive.slice().sort((a,b)=>b.week.localeCompare(a.week));let html=rows.length?rows.map(a=>`<div><h3>Week of ${esc(a.week)}</h3><table><tr><th>Service</th><th>Programmer / Coordinator</th><th>Preacher</th><th>Details</th></tr>${a.programs.map(x=>{let p=db.members.find(m=>m.id===x.programmerId),q=db.members.find(m=>m.id===x.preacherId),c=db.members.find(m=>m.id===x.coordinatorId);return `<tr><td>${esc(x.service)}</td><td>${esc((p||c)?.name||'-')}</td><td>${esc(q?.name||'-')}</td><td>${esc(x.details||'-')}</td></tr>`}).join('')}</table></div>`).join(''):'<div class="empty">No previous weekly programs archived.</div>';showRequestedReport('nro','Previous Weekly Programs Report',html)}
function homecellReport(){let rows=db.homeCells.map(h=>({cell:h.name,leader:h.leader,members:db.members.filter(m=>m.cell===h.name)}));let html=rows.length?rows.map(r=>`<div><h3>${esc(r.cell)}</h3><p>Leader: ${esc(r.leader||'-')} • Members: ${r.members.length}</p>${r.members.length?`<table><tr><th>#</th><th>Membership No.</th><th>Name</th><th>Contact</th><th>Residence</th><th>Gender</th><th>Member Category</th><th>Department</th></tr>${r.members.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.churchId)}</td><td>${esc(m.name)}</td><td>${esc(m.contact)}</td><td>${esc(m.residence)}</td><td>${esc(m.gender||'-')}</td><td>${esc(m.type)}</td><td>${esc(m.department||'-')}</td></tr>`).join('')}</table>`:'<div class="empty">No members assigned.</div>'}</div>`).join(''):'<div class="empty">No home cells registered.</div>';showRequestedReport('nro','Home Cell Membership Report',html)}
function delMercyTransaction(type,id){let key=type==='income'?'mercyIncome':'mercyExpenses',record=db[key].find(x=>x.id===id);if(!record)return alert('Transaction was not found.');let reason=prompt('Enter the reason for deleting this transaction:','');if(reason===null||!reason.trim())return alert('A deletion reason is required.');if(!confirm('Delete this Mercy Ministry transaction and record it in Transaction Management?'))return;db.counters.audit=(db.counters.audit||0)+1;let h=db.homeCells.find(x=>x.id===record.homeCellId);db.deletedTransactions.push({id:uid(),auditId:'AUD-'+String(db.counters.audit).padStart(5,'0'),deletedAt:new Date().toISOString(),username:currentUser()?.username||'-',userName:currentUser()?.name||'-',ledger:type==='income'?'Mercy Ministry Contributions':'Mercy Ministry Expenses',transactionDate:record.date||'',name:record.contributorName||record.payee||h?.name||'',reference:record.ref||record.receiptNo||'',amount:+record.amount||0,reason:reason.trim(),record:{...record}});db[key]=db[key].filter(x=>x.id!==id);save();reloadDatabase();render()}
function exportDeletedTransactions(){let h=['Audit ID','Deleted At','Username','Ledger','Transaction Date','Name / Payee','Reference','Amount','Reason'];let r=db.deletedTransactions.map(x=>[x.auditId,x.deletedAt,x.username,x.ledger,x.transactionDate,x.name,x.reference,x.amount,x.reason]);let s=[h,...r].map(a=>a.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\\n'),b=new Blob([s],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='LSCC-Deleted-Transaction-Audit.csv';a.click()}
function mercyReport(){let rows=db.homeCells.map(h=>{let inc=sum(db.mercyIncome.filter(x=>x.homeCellId===h.id)),ex=sum(db.mercyExpenses.filter(x=>x.homeCellId===h.id));return {h,inc,ex,b:inc-ex}});let html=`<h3>Mercy Ministry Records by Home Cell</h3><table><tr><th>Home Cell</th><th>Leader</th><th>Contributions</th><th>Expenses</th><th>Balance</th></tr>${rows.map(r=>`<tr><td>${esc(r.h.name)}</td><td>${esc(r.h.leader||'-')}</td><td>${money(r.inc)}</td><td>${money(r.ex)}</td><td>${money(r.b)}</td></tr>`).join('')}</table><h4>Detailed Records</h4>${rows.map(r=>`<h4>${esc(r.h.name)}</h4><table><tr><th>Date</th><th>Type</th><th>Contributor / Payee</th><th>Member No.</th><th>Contact</th><th>Purpose / Category</th><th>Receipt</th><th>Amount</th></tr>${db.mercyIncome.filter(x=>x.homeCellId===r.h.id).map(x=>`<tr><td>${esc(x.date)}</td><td>Contribution</td><td>${esc(x.contributorName||'-')}</td><td>${esc(x.churchId||'-')}</td><td>${esc(x.contact||'-')}</td><td>${esc(x.category||'-')}</td><td>-</td><td>${money(x.amount)}</td></tr>`).join('')}${db.mercyExpenses.filter(x=>x.homeCellId===r.h.id).map(x=>`<tr><td>${esc(x.date)}</td><td>Expense</td><td>${esc(x.payee||'-')}</td><td>-</td><td>-</td><td>${esc(x.purpose||x.category||'-')}</td><td>${esc(x.receiptNo||'-')}</td><td>${money(x.amount)}</td></tr>`).join('')}</table>`).join('')}`;showRequestedReport('nro','Mercy Ministry Report',html)}
function projectReport(){let target=+(db.settings.partnerTarget||0),projectI=db.income.filter(x=>x.incomeGroup==='Project'),months={};projectI.forEach(x=>{let m=x.date?.slice(0,7);if(m)months[m]=(months[m]||0)+(+x.amount||0)});let ms=Object.entries(months).sort();let max=Math.max(1,...ms.map(x=>x[1]));let w=760,h=280,pad=45;let pts=ms.map((x,i)=>{let xx=pad+(i*(w-pad*2)/Math.max(1,ms.length-1)),yy=h-pad-(x[1]/max)*(h-pad*2);return `${xx},${yy}`}).join(' ');let partnerRows=db.partners.map(p=>{let c=sum(projectI.filter(x=>x.partnerId===p.id)),pct=target?c/target*100:0;return {p,c,pct}}).sort((a,b)=>b.pct-a.pct).slice(0,5);let consistency=db.partners.map(p=>{let rows=projectI.filter(x=>x.partnerId===p.id),months=new Set(rows.map(x=>x.date?.slice(0,7)).filter(Boolean));return {p,count:months.size,total:sum(rows)}}).sort((a,b)=>b.count-a.count||b.total-a.total).slice(0,5);let html=`<h3>Project Contribution Trajectory</h3><svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;border:1px solid #e5e7eb;background:#fff"><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#94a3b8"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="#94a3b8"/>${pts?`<polyline points="${pts}" fill="none" stroke="#2563eb" stroke-width="3"/>`:''}${ms.map((x,i)=>{let xx=pad+(i*(w-pad*2)/Math.max(1,ms.length-1)),yy=h-pad-(x[1]/max)*(h-pad*2);return `<circle cx="${xx}" cy="${yy}" r="4" fill="#2563eb"/><text x="${xx}" y="${h-12}" text-anchor="middle" font-size="10">${x[0]}</text>`}).join('')}</svg><h3>Other Project Contributors</h3><p><b>${money(sum(projectI.filter(x=>x.otherPartner||x.otherMember)))}</b> recorded under Other. These are excluded from the registered-partner rankings.</p><h3>Top 5 Partners by Target Performance</h3><p class="sub">Target per partner: ${money(target)}</p><table><tr><th>#</th><th>Partner</th><th>Contribution</th><th>Target</th><th>Achievement</th></tr>${partnerRows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.p.name)}</td><td>${money(r.c)}</td><td>${money(target)}</td><td>${r.pct.toFixed(1)}%</td></tr>`).join('')}</table><h3>Top 5 Most Consistent Partners</h3><table><tr><th>#</th><th>Partner</th><th>Contribution Months</th><th>Total Contribution</th></tr>${consistency.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.p.name)}</td><td>${r.count}</td><td>${money(r.total)}</td></tr>`).join('')}</table>`;showRequestedReport('nro','Project Performance Report',html)}

function office(){let rows=db.officeSchedule.slice().sort((a,b)=>(a.date+' '+a.time).localeCompare(b.date+' '+b.time));let table=rows.length?'<table><tr><th>Date</th><th>Time</th><th>Type</th><th>Engagement</th><th>Person / Organization</th><th>Venue</th><th>Priority</th><th>Status</th><th></th></tr>'+rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.time||'-')}</td><td>${esc(x.type)}</td><td><b>${esc(x.title)}</b><div class="sub">${esc(x.notes||'')}</div></td><td>${esc(x.person||'-')}<br>${esc(x.contact||'')}</td><td>${esc(x.venue||'-')}</td><td>${esc(x.priority)}</td><td>${esc(x.status)}</td><td><button class="btn" onclick="editOfficeItem('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteOfficeItem('${x.id}')">Delete</button></td></tr>`).join('')+'</table>':'<div class="empty">No Apostle Office engagements scheduled.</div>';return `<div class="panel"><h2>Apostle's Office — Appointments, Meetings & Functions</h2><div class="notice">Schedule engagements to be attended or managed by the Apostle's Office. Items remain separate from church financial records.</div><div class="form"><div><label>Type</label><select id="oaType"><option>Appointment</option><option>Meeting</option><option>Function</option></select></div><div><label>Date</label><input id="oaDate" type="date" value="${today()}"></div><div><label>Time</label><input id="oaTime" type="time"></div><div><label>Title / Engagement</label><input id="oaTitle" placeholder="e.g. Leadership meeting"></div><div><label>Person / Organization</label><input id="oaPerson"></div><div><label>Contact</label><input id="oaContact"></div><div><label>Venue</label><input id="oaVenue"></div><div><label>Priority</label><select id="oaPriority"><option>Normal</option><option>High</option><option>Urgent</option></select></div><div><label>Status</label><select id="oaStatus"><option>Scheduled</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select></div><div style="grid-column:1/-1"><label>Notes / Agenda</label><textarea id="oaNotes"></textarea></div></div><div class="actions"><button class="primary" onclick="addOfficeItem()">Schedule Engagement</button></div></div><div class="panel"><h2>Office Schedule</h2>${table}</div>`}
function addOfficeItem(){if(!requireCan('office'))return;let title=v('oaTitle').trim(),date=v('oaDate');if(!title||!date)return alert('Enter the engagement title and date.');db.officeSchedule.push({id:uid(),type:v('oaType'),date,time:v('oaTime'),title,person:v('oaPerson'),contact:v('oaContact'),venue:v('oaVenue'),priority:v('oaPriority'),status:v('oaStatus'),notes:v('oaNotes'),createdBy:currentUser()?.id||''});save();render()}
function editOfficeItem(id){let x=db.officeSchedule.find(q=>q.id===id);if(!x)return;let title=prompt('Engagement title:',x.title);if(title===null)return;let date=prompt('Date (YYYY-MM-DD):',x.date);if(date===null)return;let status=prompt('Status (Scheduled/Confirmed/Completed/Cancelled):',x.status);if(status===null)return;x.title=title.trim()||x.title;x.date=date.trim()||x.date;x.status=status.trim()||x.status;save();render()}
function deleteOfficeItem(id){if(!requireCan('office'))return;if(!confirm('Delete this office schedule item?'))return;db.officeSchedule=db.officeSchedule.filter(x=>x.id!==id);save();reloadDatabase();render()}
function addMemberType(){if(currentUser()?.role!=='Administrator')return alert('Only an Administrator can manage member types.');let x=v('newMemberType').trim();if(!x)return alert('Enter a member type.');if(db.settings.memberTypes.some(a=>a.toLowerCase()===x.toLowerCase()))return alert('That member type already exists.');db.settings.memberTypes.push(x);save();render()}
function removeMemberType(i){if(currentUser()?.role!=='Administrator')return;if(i<0||i>=db.settings.memberTypes.length)return;let x=db.settings.memberTypes[i];if(!confirm('Remove member type "'+x+'"? Existing members keep their saved type.'))return;db.settings.memberTypes.splice(i,1);save();render()}
function addMemberDepartment(){if(currentUser()?.role!=='Administrator')return alert('Only an Administrator can manage departments.');let x=v('newMemberDepartment').trim();if(!x)return alert('Enter a department.');if(db.settings.departments.some(a=>a.toLowerCase()===x.toLowerCase()))return alert('That department already exists.');db.settings.departments.push(x);deps=db.settings.departments.slice();save();render()}
function removeMemberDepartment(i){if(currentUser()?.role!=='Administrator')return;if(i<0||i>=db.settings.departments.length)return;let x=db.settings.departments[i];if(!confirm('Remove department "'+x+'"? Existing members keep their saved department.'))return;db.settings.departments.splice(i,1);deps=db.settings.departments.slice();save();render()}
function addIncomeType(){let x=v('newIncomeType').trim();if(!x)return alert('Enter an income type.');if(db.incomeTypes.some(a=>a.toLowerCase()===x.toLowerCase()))return alert('That income type already exists.');db.incomeTypes.push(x);save();render()}
function removeIncomeType(i){if(i<0||i>=db.incomeTypes.length)return;let x=db.incomeTypes[i];if(!confirm(`Remove income type "${x}" from Settings? Existing transactions are preserved.`))return;db.incomeTypes.splice(i,1);save();render()}
function addExpenseType(){let x=v('newExpenseType').trim();if(!x)return alert('Enter an expense type.');if(db.expenseTypes.some(a=>a.toLowerCase()===x.toLowerCase()))return alert('That expense type already exists.');db.expenseTypes.push(x);save();render()}
function removeExpenseType(i){if(i<0||i>=db.expenseTypes.length)return;let x=db.expenseTypes[i];if(!confirm(`Remove expense type "${x}" from Settings? Existing transactions are preserved.`))return;db.expenseTypes.splice(i,1);save();render()}

function settings(){
  let me=currentUser();
  if(me&&me.role!=='Administrator')return `<div class="panel"><h2>My Account</h2><div class="notice">Your Settings access is limited to your own account details and password. Administrative settings, backups, user management and system configuration are available only to Administrators.</div><div class="form2"><div><label>Username</label><input id="myUsername" value="${esc(me.username||'')}"></div><div><label>Display Name</label><input id="myName" value="${esc(me.name||'')}"></div><div><label>Email Address</label><input id="myEmail" type="email" value="${esc(me.email||'')}"></div><div><label>Role</label><input value="${esc(me.role||'')}" disabled></div></div><div class="actions"><button class="primary" onclick="saveMyDetails()">Save My Details</button><button class="btn" onclick="changeUserPassword('${me.id}')">Change My Password</button></div></div>`;
  return `<div class="panel"><h2>Settings & Backup</h2><div class="form2"><div><label>Church Name</label><input id="sn" value="${esc(db.settings.name)}"></div><div><label>Currency</label><input id="sc" value="${esc(db.settings.currency)}"></div><div><label>Partner Target Amount</label><input id="spt" type="number" step=".01" value="${+(db.settings.partnerTarget||0)}"><div class="sub">Applies to every registered project partner.</div></div><div><label>Opening Balance</label><input id="sob" type="number" step=".01" value="${+(db.settings.openingBalance||0)}"><div class="sub">Existing funds; excluded from income reports and pie chart.</div></div></div><div class="form2"><div><label>Cloud Server URL</label><input id="serverUrlInput" value="${esc(serverUrl())}" placeholder="http://192.168.1.10:4785"><div class="sub">Use the HTTPS cloud address on every computer, phone or tablet.</div></div><div class="actions" style="margin-top:20px"><button class="primary" onclick="saveServerUrl()">Save Cloud URL</button><button class="btn" onclick="syncNow()">Sync Now</button></div></div><div class="actions"><button class="primary" onclick="set()">Save</button><button class="btn" onclick="backup()">Backup JSON</button><button class="btn" onclick="restore()">Restore JSON</button><button class="btn danger" onclick="reset()">Reset All Data</button></div></div>
<div class="grid"><div class="panel"><h2>Member Types</h2><div class="notice">Administrator only. Add or remove the member types available during member registration.</div><div class="form2"><div><label>New Member Type</label><input id="newMemberType"></div><div class="actions" style="margin-top:20px"><button class="primary" onclick="addMemberType()">Add</button></div></div><table style="margin-top:12px"><tr><th>Member Type</th><th></th></tr>${db.settings.memberTypes.map((x,i)=>`<tr><td>${esc(x)}</td><td><button class="btn danger" onclick="removeMemberType(${i})">Remove</button></td></tr>`).join('')}</table></div><div class="panel"><h2>Membership Departments</h2><div class="notice">Administrator only. These departments appear in member registration and member editing.</div><div class="form2"><div><label>New Department</label><input id="newMemberDepartment"></div><div class="actions" style="margin-top:20px"><button class="primary" onclick="addMemberDepartment()">Add</button></div></div><table style="margin-top:12px"><tr><th>Department</th><th></th></tr>${db.settings.departments.map((x,i)=>`<tr><td>${esc(x)}</td><td><button class="btn danger" onclick="removeMemberDepartment(${i})">Remove</button></td></tr>`).join('')}</table></div></div><div class="grid"><div class="panel"><h2>Customize Income Types</h2><div class="form2"><div><label>New Income Type</label><input id="newIncomeType"></div><div class="actions" style="margin-top:20px"><button class="primary" onclick="addIncomeType()">Add</button></div></div>
<table style="margin-top:12px"><tr><th>Income Type</th><th></th></tr>${db.incomeTypes.map((x,i)=>`<tr><td>${esc(x)}</td><td><button class="btn danger" onclick="removeIncomeType(${i})">Remove</button></td></tr>`).join('')}</table></div>
<div class="panel"><h2>Customize Expense Types</h2><div class="form2"><div><label>New Expense Type</label><input id="newExpenseType"></div><div class="actions" style="margin-top:20px"><button class="primary" onclick="addExpenseType()">Add</button></div></div>
<table style="margin-top:12px"><tr><th>Expense Type</th><th></th></tr>${db.expenseTypes.map((x,i)=>`<tr><td>${esc(x)}</td><td><button class="btn danger" onclick="removeExpenseType(${i})">Remove</button></td></tr>`).join('')}</table></div></div><div class="panel"><h2>User Restrictions & Permissions</h2><div class="notice">Create restrictions for each user by selecting the sections they are allowed to access. Administrators always retain full access.</div>${db.users.map(u=>`<div style="border:1px solid #e5e7eb;border-radius:8px;padding:12px;margin:10px 0"><b>${esc(u.name)}</b> <span class="sub">(${esc(u.username)} • ${esc(u.role)})</span><div class="form" style="margin-top:10px">${allModules.map(m=>{let checked=u.role==='Administrator'||!Array.isArray(u.permissions)||u.permissions.includes(m);return `<label style="font-weight:600"><input type="checkbox" id="perm_${u.id}_${m}" ${checked?'checked':''} ${u.role==='Administrator'?'disabled':''}> ${esc(m==='office'?"Apostle's Office":m.replace(/^./,c=>c.toUpperCase()))}</label>`}).join('')}</div>${u.role!=='Administrator'?`<button class="primary" onclick="saveUserPermissions('${u.id}')">Save Restrictions</button>`:'<div class="sub">Full unrestricted access</div>'}</div>`).join('')}</div>
<div class="panel"><h2>User Accounts</h2><div class="notice">Create login credentials for staff. Passwords are stored as SHA-256 hashes in this local application.</div><div class="form"><div><label>Username</label><input id="unew"></div><div><label>Display Name</label><input id="nnew"></div><div><label>Role</label><select id="rnew"><option>Administrator</option><option>Treasurer</option><option>Auditor</option><option>Secretary</option><option>Apostle</option><option>Reverend</option></select></div><div><label>Email Address</label><input id="enew" type="email" placeholder="user@example.com"></div><div><label>Temporary Password</label><input id="pnew" type="password"></div></div><div class="actions"><button id="userSaveBtn" class="primary" onclick="addUser()">Create User</button><button id="userCancelBtn" class="btn" style="display:none" onclick="cancelUserEdit()">Cancel</button></div><table style="margin-top:12px"><tr><th>Username</th><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr>${db.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${esc(u.email||'-')}</td><td>${esc(u.role)}</td><td><button class="btn" onclick="editUser('${u.id}')">Edit Details</button> <button class="btn" onclick="changeUserPassword('${u.id}')">Change Password</button> ${u.id==='u-admin'?'<span class="sub">Default Administrator</span>':'<button class="btn danger" onclick="removeUser(\'${u.id}\')">Remove</button>'}</td></tr>`).join('')}</table></div>`
}
function saveMyDetails(){
  let me=currentUser();
  if(!me||me.role==='Administrator')return;
  let username=v('myUsername').trim(),name=v('myName').trim(),email=v('myEmail').trim().toLowerCase();
  if(!username||!name||!email)return alert('Name, username and email address cannot be blank.');
  if(db.users.some(x=>x.id!==me.id&&x.username.toLowerCase()===username.toLowerCase()))return alert('That username already exists.');
  if(db.users.some(x=>x.id!==me.id&&(x.email||'').toLowerCase()===email))return alert('That email address is already registered.');
  me.username=username;me.name=name;me.email=email;save();alert('Your account details have been updated.');render()
}

function saveUserPermissions(id){let u=db.users.find(x=>x.id===id);if(!u||u.role==='Administrator')return;u.permissions=allModules.filter(m=>$('perm_'+id+'_'+m)?.checked);save();alert('User restrictions saved.');render()}
async function addUser(){if(currentUser()?.role!=='Administrator')return alert('Only an Administrator can create users.');let username=v('unew').trim(),name=v('nnew').trim(),role=v('rnew'),email=v('enew').trim().toLowerCase(),pw=v('pnew');if(!username||!name||!pw)return alert('Enter username, display name and password.');if(db.users.some(u=>u.username.toLowerCase()===username.toLowerCase()))return alert('Username already exists.');if(!email)return alert('Email address is required for user accounts.');if(db.users.some(u=>(u.email||'').toLowerCase()===email))return alert('That email is already registered.');if(!['Administrator','Treasurer','Auditor','Secretary','Apostle','Reverend'].includes(role))return alert('Select a valid role.');db.users.push({id:uid(),username,name,email,role,passwordHash:await hashPassword(pw),permissions:allModules.slice()});save();alert('User created.');render()}
function editUser(id){if(currentUser()?.role!=='Administrator')return alert('Only an Administrator can edit user details.');let u=db.users.find(x=>x.id===id);if(!u)return;window._editingUserId=id;vSet('unew',u.username);vSet('nnew',u.name);vSet('enew',u.email||'');vSet('rnew',u.role);let b=$('userSaveBtn'),c=$('userCancelBtn');if(b){b.textContent='Save Changes';b.onclick=()=>saveUserDetailsInline(id)}if(c)c.style.display='inline-block';document.getElementById('unew')?.focus()}
function cancelUserEdit(){window._editingUserId='';vSet('unew','');vSet('nnew','');vSet('enew','');vSet('pnew','');vSet('rnew','Administrator');let b=$('userSaveBtn'),c=$('userCancelBtn');if(b){b.textContent='Create User';b.onclick=()=>addUser()}if(c)c.style.display='none'}
function saveUserDetailsInline(id){if(currentUser()?.role!=='Administrator')return alert('Only an Administrator can edit user details.');let u=db.users.find(x=>x.id===id);if(!u)return;let name=v('nnew').trim(),username=v('unew').trim(),email=v('enew').trim().toLowerCase(),role=v('rnew');if(!name||!username||!email||!role)return alert('Name, username, email and role cannot be blank.');if(db.users.some(x=>x.id!==id&&x.username.toLowerCase()===username.toLowerCase()))return alert('That username already exists.');if(db.users.some(x=>x.id!==id&&(x.email||'').toLowerCase()===email))return alert('That email is already registered.');if(!['Administrator','Treasurer','Auditor','Secretary','Apostle','Reverend'].includes(role))return alert('Invalid role.');u.name=name;u.username=username;u.email=email;u.role=role;window._editingUserId='';save();alert('User details updated.');render()}
async function changeUserPassword(id){let me=currentUser();if(!me)return;let u=db.users.find(x=>x.id===id);if(!u)return;if(me.role!=='Administrator'&&me.id!==id)return alert('Only an Administrator can change another user password.');let p=prompt('Enter the new password for '+u.username+':');if(p===null)return;if(p.length<6)return alert('Password must be at least 6 characters.');let confirmPw=prompt('Confirm the new password:');if(confirmPw!==p)return alert('Passwords do not match.');u.passwordHash=await hashPassword(p);save();alert('Password changed successfully.');if(me.id===id){sessionStorage.removeItem('lsccCurrentUser');showLogin()}}
async function forgotPassword(){let email=prompt('Enter your registered email address:');if(email===null)return;email=email.trim().toLowerCase();if(!email)return;let url=serverUrl();if(!url)return alert('Cloud server is not configured.');try{let r=await fetch(url+'/api/password-reset/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email}),cache:'no-store'});let j=await r.json().catch(()=>({}));if(!r.ok)return alert(j.error||'The password reset email could not be sent.');alert(j.message||'If the email is registered, a password reset link has been sent. Check your inbox and spam folder.')}catch(e){alert('Unable to contact the cloud password reset service.')}}
function showResetPanel(){let t=new URLSearchParams(location.search).get('reset');if(!t)return false;$('loginScreen').style.display='flex';$('loginScreen').innerHTML='<div class="loginbox"><h1>LSCC Finance Manager</h1><div class="loginheadline">Lighting up the world</div><div class="sub">Set a new password</div><div class="field"><label>New Password</label><input id="resetPass" type="password" autocomplete="new-password"></div><div class="field"><label>Confirm Password</label><input id="resetPass2" type="password" autocomplete="new-password"></div><button class="primary" onclick="confirmPasswordReset()">Reset Password</button><button class="btn" onclick="window.location.href=window.location.pathname">Back to Login</button><div id="resetErr" class="loginerr"></div></div>';return true}
async function confirmPasswordReset(){let token=new URLSearchParams(location.search).get('reset'),p=v('resetPass'),c=v('resetPass2');if(!p||p.length<6)return $('resetErr').textContent='Password must be at least 6 characters.';if(p!==c)return $('resetErr').textContent='Passwords do not match.';let url=serverUrl();try{let h=await hashPassword(p),r=await fetch(url+'/api/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,passwordHash:h}),cache:'no-store'}),j=await r.json().catch(()=>({}));if(!r.ok)return $('resetErr').textContent=j.error||'The reset link is invalid or expired.';alert('Password reset successfully. You can now sign in with your new password.');window.location.href=window.location.pathname}catch(e){$('resetErr').textContent='Unable to contact the cloud password reset service.'}}
function removeUser(id){if(currentUser()?.role!=='Administrator')return alert('Only an Administrator can remove users.');if(id==='u-admin')return alert('The default administrator cannot be removed.');if(db.users.length<=1)return alert('At least one user must remain.');if(confirm('Remove this user?')){db.users=db.users.filter(u=>u.id!==id);save();render()}}
function saveServerUrl(){let u=v('serverUrlInput').trim().replace(/\/$/,'');if(!/^https?:\/\//i.test(u))return alert('Enter a valid cloud URL, for example https://your-domain.example');localStorage.setItem(SERVER_KEY,u);alert('Cloud server URL saved.');syncNow()}
function set(){db.settings.name=v('sn')||'LSCC Finance Manager';db.settings.currency=v('sc')||'KSh';db.settings.openingBalance=+(v('sob')||0);db.settings.partnerTarget=+(v('spt')||0);save();render()}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='LSCC-Finance-Backup-'+today()+'.json';a.click()}
function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render()}catch(e){alert('Invalid backup')}};r.readAsText(i.files[0])};i.click()}
function reset(){if(confirm('Delete all records?')){db=JSON.parse(JSON.stringify(D));localSave();markPending();queueSync();render()}}
function del(type,x){
if(!Array.isArray(db[type]))return alert('The selected record type is unavailable.');
let transactionLedger={income:'Main / Project Income',expenses:'Main Church Expenses'};
let isTxn=!!transactionLedger[type];
let reason=isTxn?prompt('Enter the reason for deleting this transaction:',''):'';
if(isTxn&&(reason===null||!reason.trim()))return alert('A deletion reason is required.');
if(!confirm(isTxn?'Delete this transaction and record it in Transaction Management?':'Delete this record? This cannot be undone.'))return;
let record=db[type].find(a=>a.id===x);if(!record)return alert('The selected record was not found.');
if(isTxn){db.counters.audit=(db.counters.audit||0)+1;db.deletedTransactions.push({id:uid(),auditId:'AUD-'+String(db.counters.audit).padStart(5,'0'),deletedAt:new Date().toISOString(),username:currentUser()?.username||'-',userName:currentUser()?.name||'-',ledger:transactionLedger[type],transactionDate:record.date||'',name:record.memberId?(db.members.find(m=>m.id===record.memberId)?.name||''):record.payee||record.otherMember||record.otherPartner||'',reference:record.ref||record.receiptNo||record.voucherNo||'',amount:+record.amount||0,reason:reason.trim(),record:{...record}})}
db[type]=db[type].filter(a=>a.id!==x);
if(type==='projects') db.income=db.income.filter(a=>a.projectId!==x);
if(type==='partners') db.income=db.income.map(a=>a.partnerId===x?{...a,partnerId:'',otherPartner:true}:a);
if(type==='homeCells'){db.mercyIncome=db.mercyIncome.filter(a=>a.homeCellId!==x);db.mercyExpenses=db.mercyExpenses.filter(a=>a.homeCellId!==x)}
save();reloadDatabase();render();
}
function csv(){let a=[...db.income.map(x=>({...x,t:'Income'})),...db.expenses.map(x=>({...x,t:'Expense'}))],h=['Date','Type','Category','Amount','Payment','Reference','Project','Partner','Member'];let r=a.map(x=>[x.date,x.t,x.category||x.description||'',x.amount,x.payment||'',x.ref||'',db.projects.find(p=>p.id===x.projectId)?.name||'',db.partners.find(p=>p.id===x.partnerId)?.name||'',db.members.find(m=>m.id===x.memberId)?.name||'']);let s=[h,...r].map(a=>a.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\\n'),b=new Blob([s],{type:'text/csv'}),a1=document.createElement('a');a1.href=URL.createObjectURL(b);a1.download='LSCC-Finance-Transactions.csv';a1.click()}
function projectPie(){let p=$('projectPie'),l=$('projectLegend');if(!p)return;let target=sum(db.projects.map(x=>({amount:+x.target||0}))),raised=sum(db.projects.map(x=>({amount:sum(db.income.filter(i=>i.projectId===x.id))}))),remaining=Math.max(0,target-raised),total=raised+remaining;if(!total){p.style.background='#e5e7eb';l.innerHTML='<div class="empty">No project targets or contributions yet.</div>';return}let pct=raised/total*100;p.style.background=`conic-gradient(#2563eb 0 ${pct}%, #e5e7eb ${pct}% 100%)`;l.innerHTML=`<div><span><i class="dot" style="background:#2563eb"></i>Raised</span><b>${money(raised)}</b></div><div><span><i class="dot" style="background:#e5e7eb"></i>Remaining</span><b>${money(remaining)}</b></div><div><span>Overall Progress</span><b>${pct.toFixed(1)}%</b></div>`}
function pie(){let o={};db.income.filter(x=>(x.incomeGroup||'General')==='General').forEach(x=>{let m=x.date?.slice(0,7);if(m)o[m]=(o[m]||0)+(+x.amount||0)});let a=Object.entries(o).sort(),tot=sum(a.map(x=>({amount:x[1]}))),cols=['#2563eb','#16a34a','#f59e0b','#7c3aed','#db2777','#0891b2','#ea580c','#4f46e5'];let p=$('pie'),l=$('legend');if(!p)return;if(!a.length){p.style.background='#e5e7eb';l.innerHTML='<div class="empty">No income data.</div>';return}let cur=0,parts=[];a.forEach((x,i)=>{let q=x[1]/tot*100;parts.push(`${cols[i%cols.length]} ${cur}% ${cur+q}%`);cur+=q});p.style.background=`conic-gradient(${parts.join(',')})`;l.innerHTML=a.map((x,i)=>`<div><span><i class="dot" style="background:${cols[i%cols.length]}"></i>${x[0]}</span><b>${money(x[1])}</b></div>`).join('')}
addEventListener('hashchange',render);if(!showResetPanel())render();
