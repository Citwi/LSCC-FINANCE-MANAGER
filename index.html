<title>LSCC Finance Manager</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;background:#f4f7fb;color:#172033}.app{display:flex;min-height:100vh}.side{width:230px;background:#18324a;color:#fff;padding:20px;flex-shrink:0}.brand{font-size:20px;font-weight:800;margin-bottom:20px}.brand small{display:block;font-size:11px;opacity:.7;margin-top:4px}.side button{display:block;width:100%;padding:11px;margin:3px 0;border:0;border-radius:7px;background:transparent;color:#dbe7f3;text-align:left;cursor:pointer}.side button:hover,.side button.on{background:#294b69;color:#fff}.main{padding:24px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;margin-bottom:18px}.top h1{margin:0}.sub{color:#667085;font-size:12px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #dce4ee;border-radius:11px;padding:16px;margin-bottom:16px;box-shadow:0 2px 7px #00000008}.label{font-size:11px;color:#667085}.value{font-size:22px;font-weight:800;margin-top:5px}.green{color:#15803d}.red{color:#b91c1c}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.form2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;font-size:12px;font-weight:700;color:#475467;margin-bottom:4px}input,select,textarea{width:100%;padding:9px;border:1px solid #cfd8e3;border-radius:6px;background:#fff}textarea{min-height:75px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}button.primary,.btn{padding:9px 13px;border:0;border-radius:6px;cursor:pointer;font-weight:700}.primary{background:#2563eb;color:white}.btn{background:#edf2f7;color:#243447}.danger{background:#fee2e2;color:#991b1b}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #edf0f4;text-align:left}th{font-size:10px;color:#667085;text-transform:uppercase}.bar{height:8px;background:#e9eef5;border-radius:99px;overflow:hidden}.bar i{disp .login{position:fixed;inset:0;background:#18324a;display:flex;align-items:center;justify-content:center;z-index:9999}
.dashboard-wallpaper{position:relative;overflow:hidden;border-radius:18px;padding:4px;margin:-4px;min-height:calc(100vh - 150px);background:linear-gradient(120deg,#2563eb,#7c3aed,#db2777,#0891b2,#16a34a);background-size:500% 500%;animation:lsccGradient 18s ease infinite;}
.dashboard-wallpaper:before,.dashboard-wallpaper:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.34;pointer-events:none;animation:lsccFloat 14s ease-in-out infinite;}
.dashboard-wallpaper:before{width:360px;height:360px;left:-100px;top:-100px;background:radial-gradient(circle,#fff 0%,#60a5fa 35%,transparent 70%);}
.dashboard-wallpaper:after{width:430px;height:430px;right:-140px;bottom:-160px;background:radial-gradient(circle,#fff 0%,#f0abfc 32%,transparent 70%);animation-delay:-7s;}
.dashboard-wallpaper > .panel,.dashboard-wallpaper > .grid,.dashboard-wallpaper > .cards{position:relative;z-index:1;}
.dashboard-wallpaper .card,.dashboard-wallpaper .panel{background:rgba(255,255,255,.93);backdrop-filter:blur(7px);}
@keyframes lsccGradient{0%,100%{background-position:0% 50%}25%{background-position:100% 0%}50%{background-position:100% 100%}75%{background-position:0% 100%}}
@keyframes lsccFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(45px,28px) scale(1.12)}}

async function syncToServer(force=true){if(syncPromise)return syncPromise;let url=serverUrl(),token=sessionStorage.getItem('lsccSessionToken');if(!url||!token){setSyncStatus('not connected','bad');return false}clearTimeout(syncTimer);syncPromise=(async()=>{try{let didWork=false;while(force||syncedGeneration<syncGeneration){let targetGeneration=syncGeneration,payload=JSON.parse(JSON.stringify(db)),revision=centralRevision;setSyncStatus('saving…','pending');let r=await fetch(url+'/api/state',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({db:payload,revision}),cache:'no-store'});if(r.status===401){sessionStorage.removeItem('lsccCurrentUser');sessionStorage.removeItem('lsccSessionToken');showLogin();return false}if(r.status===409){let j=await r.json().catch(()=>({}));setSyncStatus('conflict','bad');alert('Cloud sync conflict detected. The cloud database has newer data (revision '+(j.revision??'?')+'). Your current device data was NOT overwritten. Use Sync Now to download the cloud copy before continuing.');return false}if(!r.ok){let err=await r.json().catch(()=>({}));throw new Error(err.error||('Sync failed ('+r.status+')'));}let j=await r.json();centralRevision=Number(j.revision||centralRevision);localStorage.setItem('lsccCentralRevision',String(centralRevision));syncedGeneration=targetGeneration;localStorage.setItem('lsccSyncedGeneration',String(syncedGeneration));localStorage.removeItem('lsccPendingSync');didWork=true;force=false}setSyncStatus('synced','ok');return didWork||syncedGeneration===syncGeneration}catch(e){localStorage.setItem('lsccPendingSync','1');setSyncStatus('offline: '+(e.message||'sync failed'),'bad');return false}finally{syncPromise=null}})();return syncPromise}
async function syncNow(){let url=serverUrl(),token=sessionStorage.getItem('lsccSessionToken');if(!url)return alert('Set the Cloud Server URL first.');if(!token)return alert('Please log in first.');if(localStorage.getItem('lsccPendingSync')==='1'){let ok=await syncToServer(true);if(!ok)return alert('The latest device data could not be saved to the cloud. Your data has been kept on this device.');render();return}return syncFromServer(true)}

function projects(){return `<div class="panel"><h2>Create Church Project</h2><div class="form"><div><label>Project Name</label><input id="pn"></div><div><label>Target Amount</label><input id="pt" type="number" step=".01"></div><div><label>Start Date</label><input id="pd" type="date" value="${today()}"></div></div><div style="margin-top:12px"><label>Description</label><textarea id="px"></textarea></div><div class="actions"><button class="primary" onclick="addProject()">Create Project</button></div></div><div class="panel"><h2>Project Partner Database</h2><div class="notice">Set one target amount per partner; it applies to all registered partners.</div><div class="form"><div><label>Target Amount Per Partner</label><input id="partnerTarget" type="number" step=".01" value="${+(db.settings.partnerTarget||0)}"></div></div><div class="actions"><button class="btn" onclick="savePartnerTarget()">Save Partner Target</button></div><div class="form"><div><label>Partner Name</label><input id="rn"></div><div><label>ID</label><input id="ri"></div><div><label>Contact</label><input id="rc"></div><div><label>Partner Type</label><select id="rt"><option>Church Member</option><option>Non Member</option></select></div><div><label>Linked Church Member</label><select id="rm"><option value="">-- None --</option>${db.members.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.churchId)})</option>`).join('')}</select></div></div><div class="actions"><button id="partnerSaveBtn" class="primary" onclick="savePartnerForm()">Add Partner</button><button id="partnerCancelBtn" class="btn" style="display:none" onclick="cancelPartnerEdit()">Cancel</button></div></div><div class="panel"><h2>Projects</h2>${db.projects.map(p=>{let r=sum(db.income.filter(i=>i.projectId===p.id)),pct=p.target?r/p.target*100:0;return `<div class="panel"><h3>${esc(p.name)}</h3><p>${esc(p.description||'')}</p><p><b>Target:</b> ${money(p.target)} &nbsp; <b>Raised:</b> ${money(r)} &nbsp; <b>Balance:</b> ${money(Math.max(0,p.target-r))}</p><div class="bar"><i style="width:${Math.min(100,pct)}%"></i></div><p class="sub">${pct.toFixed(1)}% complete</p><button class="btn" onclick="editProject('${p.id}')">Edit Project</button> <button class="btn danger" onclick="del('projects','${p.id}')">Delete Project</button></div>`}).join('')||'<div class="empty">No projects.</div>'}</div><div class="panel"><h2>Partners (${db.partners.length})</h2>${db.partners.length?`<table><tr><th>Name</th><th>ID</th><th>Contact</th><th>Type</th><th>Linked Member</th><th>Contributions</th><th></th></tr>${db.partners.map(p=>{let m=db.members.find(x=>x.id===p.memberId),r=sum(db.income.filter(i=>i.partnerId===p.id));return `<tr><td>${esc(p.name)}</td><td>${esc(p.idNo)}</td><td>${esc(p.contact)}</td><td>${p.type}</td><td>${esc(m?.name||'-')}</td><td class="green">${money(r)}</td><td><button class="btn" onclick="editPartner('${p.id}')">Edit</button> <button class="btn danger" onclick="del('partners','${p.id}')">Delete</button></td></tr>`}).join('')}</table>`:'<div class="empty">No partners.</div>'}</div>`}
function addProject(){let x={id:uid(),name:v('pn'),target:+v('pt'),date:v('pd'),description:v('px')};if(!x.name||x.target<=0)return alert('Enter project name and target.');db.projects.push(x);save();render()}
function editProject(id){let p=db.projects.find(x=>x.id===id);if(!p)return;$('title').textContent='Edit Project';$('view').innerHTML=`<div class="panel"><h2>Edit Church Project</h2><div class="form"><div><label>Project Name</label><input id="epn" value="${esc(p.name)}"></div><div><label>Target Amount</label><input id="ept" type="number" step=".01" value="${+(p.target||0)}"></div><div><label>Start Date</label><input id="epd" type="date" value="${esc(p.date||'')}"></div></div><div style="margin-top:12px"><label>Description</label><textarea id="epx">${esc(p.description||'')}</textarea></div><div class="actions"><button class="primary" onclick="saveProjectEdit('${p.id}')">Save Changes</button><button class="btn" onclick="go('projects')">Cancel</button></div></div>`}
function saveProjectEdit(id){let p=db.projects.find(x=>x.id===id);if(!p)return;let name=v('epn').trim(),target=+v('ept');if(!name||target<=0)return alert('Enter project name and a valid target amount.');Object.assign(p,{name,target,date:v('epd'),description:v('epx')});save();go('projects')}
function addPartner(){let x={id:uid(),name:v('rn'),idNo:v('ri'),contact:v('rc'),type:v('rt'),memberId:v('rm')};if(!x.name)return alert('Partner name is required.');db.partners.push(x);save();render()}
function editPartner(id){let p=db.partners.find(x=>x.id===id);if(!p)return;window._editingPartnerId=id;vSet('rn',p.name);vSet('ri',p.idNo||'');vSet('rc',p.contact||'');vSet('rt',p.type||'Church Member');vSet('rm',p.memberId||'');$('partnerSaveBtn').textContent='Save Changes';$('partnerCancelBtn').style.display='inline-block';document.getElementById('rn')?.focus()}
function cancelPartnerEdit(){window._editingPartnerId='';vSet('rn','');vSet('ri','');vSet('rc','');vSet('rt','Church Member');vSet('rm','');$('partnerSaveBtn').textContent='Add Partner';$('partnerCancelBtn').style.display='none'}
function savePartnerForm(){if(!window._editingPartnerId)return addPartner();let p=db.partners.find(x=>x.id===window._editingPartnerId);if(!p)return cancelPartnerEdit();let name=v('rn').trim(),idNo=v('ri').trim();if(!name)return alert('Partner name is required.');if(db.partners.some(x=>x.id!==p.id&&x.idNo===idNo&&idNo))return alert('That partner ID already exists.');Object.assign(p,{name,idNo,contact:v('rc').trim(),type:v('rt'),memberId:v('rm')});window._editingPartnerId='';save();render()}
function savePartnerTarget(){db.settings.partnerTarget=+(v('partnerTarget')||0);save();render()}

function logs(){let a=[...db.income.map(x=>({...x,t:'Income'})),...db.expenses.map(x=>({...x,t:'Expense'}))].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="panel"><div class="actions no-print"><input class="search" id="ls" placeholder="Search entries..." oninput="logList()"><select id="lt" onchange="logList()"><option>All</option><option>Income</option><option>Expense</option></select><button class="btn" onclick="csv()">Export CSV</button></div><div id="ll">${logTable(a)}</div></div>`}
function logTable(a){return a.length?`<table><tr><th>Date</th><th>Type</th><th>Description</th><th>Person / Partner</th><th>Amount</th><th></th></tr>${a.map(x=>{let n=x.partnerId?db.partners.find(p=>p.id===x.partnerId)?.name:x.memberId?db.members.find(m=>m.id===x.memberId)?.name:'';return `<tr><td>${x.date}</td><td>${x.t}</td><td>${esc(x.service||x.description||x.category)}</td><td>${esc(n||'-')}</td><td class="${x.t==='Income'?'green':'red'}">${money(x.amount)}</td><td><button class="btn danger" onclick="del('${x.t==='Income'?'income':'expense'}','${x.id}')">Delete</button></td></tr>`}).join('')}</table>`:'<div class="empty">No entries.</div>'}
function logList(){let q=v('ls').toLowerCase(),t=v('lt'),a=[...db.income.map(x=>({...x,t:'Income'})),...db.expenses.map(x=>({...x,t:'Expense'}))].filter(x=>(t==='All'||x.t===t)&&JSON.stringify(x).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));$('ll').innerHTML=logTable(a)}
function transactionManagement(){
  let a=db.deletedTransactions.slice().sort((x,y)=>(y.deletedAt||'').localeCompare(x.deletedAt||''));
  let q=String(v('tmSearch')||'').toLowerCase();
  if(q)a=a.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
  let rows=a.map(x=>`<tr><td>${esc(x.auditId)}</td><td>${esc(x.deletedAt||'-')}</td><td>${esc(x.username||'-')}</td><td>${esc(x.ledger||'-')}</td><td>${esc(x.transactionDate||'-')}</td><td>${esc(x.name||'-')}</td><td>${esc(x.reference||'-')}</td><td>${money(x.amount)}</td><td>${esc(x.reason||'-')}</td><td><button class="btn" onclick="viewDeletedTransaction('${x.id}')">View</button></td></tr>`).join('');
  return `<div class="panel"><h2>Transaction Management</h2><div class="notice">Deleted financial transactions are retained here as an audit record. Each deletion records the audit ID, logged-in username, date/time, transaction details and the reason supplied before deletion.</div><div class="actions no-print"><input class="search" id="tmSearch" placeholder="Search deleted transactions..." value="${esc(v('tmSearch')||'')}" oninput="renderTransactionManagement()"><button class="btn" onclick="exportDeletedTransactions()">Export Audit CSV</button></div>${a.length?`<table><tr><th>Audit ID</th><th>Deleted At</th><th>Username</th><th>Ledger</th><th>Transaction Date</th><th>Name / Payee</th><th>Reference</th><th>Amount</th><th>Deletion Reason</th><th></th></tr>${rows}</table>`:'<div class="empty">No deleted financial transactions have been recorded.</div>'}</div>
  <div class="panel"><h2>Reprint Member Receipts</h2><div class="notice">Search by member name, National ID or LSCC church membership number to retrieve contribution receipts.</div><div class="form"><div style="grid-column:1/-1"><label>Search Member</label><input id="receiptSearch" placeholder="Name, ID or LSCC membership number" oninput="receiptSearchList()"></div></div><div id="receiptResults">${receiptSearchTable('')}</div></div>`;
}
function renderTransactionManagement(){let el=$('view');if(!el)return;el.innerHTML=transactionManagement()}
function viewDeletedTransaction(id){let x=db.deletedTransactions.find(q=>q.id===id);if(!x)return;alert(`Audit ID: ${x.auditId}\nUsername: ${x.username}\nLedger: ${x.ledger}\nTransaction Date: ${x.transactionDate||'-'}\nReference: ${x.reference||'-'}\nAmount: ${money(x.amount)}\nReason: ${x.reason||'-'}`)}
function receiptSearchTable(q){q=String(q||'').toLowerCase();let rows=[];db.income.forEach(x=>{let m=db.members.find(mm=>mm.id===x.memberId);let name=m?.name||x.otherMember||x.otherPartner||'';let idNo=m?.idNo||'';let churchId=m?.churchId||'';if(x.memberId||m||x.otherMember){rows.push({x,name,idNo,churchId,ledger:(x.incomeGroup||'General')==='Project'?'Project Contribution':'Main Church Income'})}});db.mercyIncome.forEach(x=>{let name=x.contributorName||'',idNo=x.idNo||'',churchId=x.churchId||'';if(name||churchId||idNo)rows.push({x,name,idNo,churchId,ledger:'Mercy Ministry Contribution',mercy:true})});rows=rows.filter(r=>!q||`${r.name} ${r.idNo} ${r.churchId} ${r.x.ref||r.x.receiptNo||''}`.toLowerCase().includes(q)).sort((a,b)=>String(b.x.date||'').localeCompare(String(a.x.date||'')));return rows.length?`<table><tr><th>Date</th><th>Member / Contributor</th><th>National ID</th><th>Church Membership</th><th>Ledger</th><th>Category</th><th>Receipt</th><th>Amount</th><th></th></tr>${rows.map(r=>`<tr><td>${esc(r.x.date)}</td><td>${esc(r.name||'-')}</td><td>${esc(r.idNo||'-')}</td><td>${esc(r.churchId||'-')}</td><td>${esc(r.ledger)}</td><td>${esc(r.x.category||r.x.purpose||'-')}</td><td>${esc(r.x.ref||r.x.receiptNo||'-')}</td><td class="green">${money(r.x.amount)}</td><td><button class="btn" onclick="${r.mercy?`printMercyContributionReceipt('${r.x.id}')`:`printMemberReceipt('${r.x.id}')`}">Reprint Receipt</button></td></tr>`).join('')}</table>`:'<div class="empty">No member transactions found.</div>'}
function receiptSearchList(){let el=$('receiptResults');if(el)el.innerHTML=receiptSearchTable(v('receiptSearch'))}
function printMemberReceipt(id){let x=db.income.find(q=>q.id===id);if(!x)return;let m=db.members.find(q=>q.id===x.memberId),project=db.projects.find(q=>q.id===x.projectId),name=m?.name||x.otherMember||x.otherPartner||'Church Member';let html=`<div style="max-width:680px;margin:auto;border:1px solid #ccc;padding:28px;font-family:Arial">${receiptLogoMarkup()}<h2 style="text-align:center">${esc(db.settings.name)}</h2><h3 style="text-align:center">MEMBER CONTRIBUTION RECEIPT</h3><p><b>Receipt No:</b> ${esc(x.ref||x.receiptNo||'-')} &nbsp; <b>Date:</b> ${esc(x.date)}</p><table style="width:100%;border-collapse:collapse"><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Member / Contributor</th><td style="border:1px solid #ccc;padding:8px">${esc(name)}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">National ID</th><td style="border:1px solid #ccc;padding:8px">${esc(m?.idNo||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Church Membership</th><td style="border:1px solid #ccc;padding:8px">${esc(m?.churchId||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Income Type</th><td style="border:1px solid #ccc;padding:8px">${esc(x.category||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Project</th><td style="border:1px solid #ccc;padding:8px">${esc(project?.name||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Payment Method</th><td style="border:1px solid #ccc;padding:8px">${esc(x.payment||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Amount</th><td style="border:1px solid #ccc;padding:8px"><b>${money(x.amount)}</b></td></tr></table><br><p>Prepared by: ${esc(currentUser()?.name||'-')}</p><p style="margin-top:50px">Authorized Signature: __________________________</p></div>`;printReceiptHtml(html,x.ref||x.receiptNo||'Member Receipt')}
function printMercyContributionReceipt(id){let x=db.mercyIncome.find(q=>q.id===id);if(!x)return;let h=db.homeCells.find(q=>q.id===x.homeCellId);let html=`<div style="max-width:680px;margin:auto;border:1px solid #ccc;padding:28px;font-family:Arial">${receiptLogoMarkup()}<h2 style="text-align:center">${esc(db.settings.name)}</h2><h3 style="text-align:center">MERCY MINISTRY CONTRIBUTION RECEIPT</h3><p><b>Receipt No:</b> ${esc(x.ref||x.receiptNo||'-')} &nbsp; <b>Date:</b> ${esc(x.date)}</p><p><b>Home Cell:</b> ${esc(h?.name||'-')}</p><table style="width:100%;border-collapse:collapse"><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Contributor</th><td style="border:1px solid #ccc;padding:8px">${esc(x.contributorName||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">National ID</th><td style="border:1px solid #ccc;padding:8px">${esc(x.idNo||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Church Membership</th><td style="border:1px solid #ccc;padding:8px">${esc(x.churchId||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Purpose</th><td style="border:1px solid #ccc;padding:8px">${esc(x.category||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Amount</th><td style="border:1px solid #ccc;padding:8px"><b>${money(x.amount)}</b></td></tr></table><br><p>Prepared by: ${esc(currentUser()?.name||'-')}</p><p style="margin-top:50px">Authorized Signature: __________________________</p></div>`;printReceiptHtml(html,x.ref||x.receiptNo||'Mercy Receipt')}
function printReceiptHtml(html,title){let w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print the receipt.');w.document.write(`<html><head><title>${esc(title)}</title></head><body>${html}</body></html>`);w.document.close();w.focus();w.print()}

function inquiry(){
return `<div class="panel"><h2>Individual Project Partner Contribution Inquiry</h2>
<div class="notice">Select a project and partner to generate a contribution statement showing each individual contribution, dates, references and totals.</div>
<div class="form">
<div><label>Project</label><select id="qproj"><option value="">-- Select Project --</option>${db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
<div><label>Find Partner (Name or ID)</label><input id="qpartnerSearch" placeholder="Type partner name or ID" oninput="filterInquiryPartners()" autocomplete="off"></div><div><label>Matching Partners</label><select id="qpartner"><option value="">-- Select Matching Partner --</option></select></div>
</div>
<div class="actions"><button class="primary" onclick="generateInquiry()">Generate Statement</button><button class="btn" onclick="print()">Print Statement</button></div>
<div id="inquiryOut"></div></div>`;
}
function filterInquiryPartners(){let q=v('qpartnerSearch').trim().toLowerCase(),sel=$('qpartner');if(!sel)return;let matches=db.partners.filter(p=>!q||[p.name,p.idNo].filter(Boolean).join(' ').toLowerCase().includes(q));sel.innerHTML='<option value="">-- Select Matching Partner --</option>'+matches.map(p=>`<option value="${p.id}">${esc(p.name)} — ID: ${esc(p.idNo||'-')}</option>`).join('');if(matches.length===1)sel.value=matches[0].id}
function generateInquiry(){
let pid=v('qproj'),rid=v('qpartner');
if(!pid||!rid)return alert('Select both a project and partner.');
let p=db.projects.find(x=>x.id===pid),r=db.partners.find(x=>x.id===rid);
let rows=db.income.filter(x=>x.projectId===pid&&x.partnerId===rid).sort((a,b)=>a.date.localeCompare(b.date));
let total=sum(rows),m=r.memberId?db.members.find(x=>x.id===r.memberId):null;
$('inquiryOut').innerHTML=`<div class="panel" style="margin-top:18px"><h2>${esc(p.name)} — Partner Contribution Statement</h2>
<p><b>Partner:</b> ${esc(r.name)} &nbsp; <b>ID:</b> ${esc(r.idNo)} &nbsp; <b>Contact:</b> ${esc(r.contact)} &nbsp; <b>Status:</b> ${esc(r.type)}</p>
${m?`<p><b>Church Member:</b> ${esc(m.name)} (${esc(m.churchId)})</p>`:''}
<table><tr><th>Date</th><th>Category</th><th>Payment</th><th>Reference</th><th>Amount</th></tr>
${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.payment)}</td><td>${esc(x.ref||'-')}</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No contributions found for this project and partner.</td></tr>'}
<tr><th colspan="4">TOTAL CONTRIBUTION</th><th class="green">${money(total)}</th></tr></table></div>`;
}
function homecells(){return `<div class="panel"><h2>Home Cell Register</h2><div class="form"><div><label>Home Cell Name</label><input id="hname"></div><div><label>Leader</label><select id="hleaderId" onchange="autofillHomeLeader()"><option value="">-- Select Member Leader --</option>${db.members.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.churchId)})</option>`).join('')}</select></div><div><label>Leader Name</label><input id="hleader" readonly></div><div><label>Contact</label><input id="hcontact" readonly></div><div><label>Meeting Location</label><input id="hlocation"></div><div><label>Meeting Day</label><input id="hday" placeholder="e.g. Wednesday"></div><div><label>Description</label><input id="hdesc"></div></div><div class="actions"><button id="homeCellSaveBtn" class="primary" onclick="saveHomeCellForm()">Register Home Cell</button><button id="homeCellCancelBtn" class="btn" style="display:none" onclick="cancelHomeCellEdit()">Cancel</button></div></div>
<div class="panel"><h2>Mercy Support — Home Cell Contributions & Expenses</h2><div class="notice">Mercy Support is kept separately from main church finance. Contributor details are linked to the selected home-cell member and can be reviewed before saving.</div><div class="grid">
<div><h3>Mercy Support Contribution</h3><div class="form"><div><label>Date</label><input id="miDate" type="date" value="${today()}"></div><div><label>Home Cell</label><select id="miCell" onchange="loadMercyContributors('miCell','miMember','miName','miChurchId','miContact','miResidence')"><option value="">-- Select Home Cell --</option>${db.homeCells.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('')}</select></div><div><label>Find Contributor (Name, ID or Membership Number)</label><input id="mercyPersonSearch" placeholder="Type name, ID or LSCC number" oninput="filterMercyContributors()"></div><div><label>Contributor</label><select id="miMember" onchange="autofillMercyContributor()"><option value="">-- Select Contributor --</option></select></div><div><label>Contributor Name</label><input id="miName"></div><div><label>Membership No.</label><input id="miChurchId"></div><div><label>Contact</label><input id="miContact"></div><div><label>Residence</label><input id="miResidence"></div><div><label>Purpose / Category</label><input id="miCat" placeholder="e.g. Mercy support contribution"></div><div><label>Amount</label><input id="miAmt" type="number" step=".01"></div></div><button class="primary" onclick="addMercyIncome()">Save Mercy Contribution</button></div>
<div><h3>Mercy Support Expense</h3><div class="form"><div><label>Date</label><input id="meDate" type="date" value="${today()}"></div><div><label>Home Cell</label><select id="meCell"><option value="">-- Select Home Cell --</option>${db.homeCells.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('')}</select></div><div><label>Expense Purpose</label><input id="mePurpose" placeholder="e.g. Medical assistance / food support"></div><div><label>Payee / Recipient</label><input id="mePayee"></div><div><label>Amount</label><input id="meAmt" type="number" step=".01"></div><div><label>Payment Method</label><select id="mePayment"><option>Cash</option><option>M-Pesa</option><option>Bank</option><option>Cheque</option><option>Other</option></select></div></div><button class="primary" onclick="addMercyExpense()">Save Expense & Generate Receipt</button></div></div></div>
<div class="panel"><h2>Mercy Support Records</h2>${db.mercyIncome.length?`<h3>Contributions</h3><table><tr><th>Date</th><th>Home Cell</th><th>Contributor</th><th>Member No.</th><th>Contact</th><th>Residence</th><th>Purpose</th><th>Amount</th><th></th></tr>${db.mercyIncome.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>{let h=db.homeCells.find(q=>q.id===x.homeCellId);return `<tr><td>${esc(x.date)}</td><td>${esc(h?.name||'-')}</td><td>${esc(x.contributorName||'-')}</td><td>${esc(x.churchId||'-')}</td><td>${esc(x.contact||'-')}</td><td>${esc(x.residence||'-')}</td><td>${esc(x.category||'-')}</td><td class="green">${money(x.amount)}</td><td><button class="btn danger" onclick="delMercyTransaction('income','${x.id}')">Delete</button></td></tr>`}).join('')}</table>`:'<div class="empty">No Mercy Support contributions recorded.</div>'}${db.mercyExpenses.length?`<h3>Expenses</h3><table><tr><th>Date</th><th>Home Cell</th><th>Purpose</th><th>Payee / Recipient</th><th>Payment</th><th>Receipt</th><th>Amount</th><th></th></tr>${db.mercyExpenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>{let h=db.homeCells.find(q=>q.id===x.homeCellId);return `<tr><td>${esc(x.date)}</td><td>${esc(h?.name||'-')}</td><td>${esc(x.purpose||x.category||'-')}</td><td>${esc(x.payee||'-')}</td><td>${esc(x.payment||'-')}</td><td>${esc(x.receiptNo||'-')}</td><td class="red">${money(x.amount)}</td><td><button class="btn" onclick="printMercyReceipt('${x.id}')">Print Receipt</button> <button class="btn danger" onclick="delMercyTransaction('expense','${x.id}')">Delete</button></td></tr>`}).join('')}</table>`:'<div class="empty">No Mercy Support expenses recorded.</div>'}</div>
<div class="panel"><h2>Registered Home Cells (${db.homeCells.length})</h2>${db.homeCells.length?`<table><tr><th>Home Cell</th><th>Leader</th><th>Contact</th><th>Location</th><th>Meeting Day</th><th>Members</th><th>Mercy Balance</th><th></th></tr>${db.homeCells.map(h=>{let mi=sum(db.mercyIncome.filter(x=>x.homeCellId===h.id)),me=sum(db.mercyExpenses.filter(x=>x.homeCellId===h.id));return `<tr><td>${esc(h.name)}</td><td>${esc(h.leader)}</td><td>${esc(h.contact)}</td><td>${esc(h.location)}</td><td>${esc(h.day)}</td><td>${db.members.filter(m=>m.cell===h.name).length}</td><td>${money(mi-me)}</td><td><button class="btn" onclick="editHomeCell('${h.id}')">Edit</button> <button class="btn danger" onclick="del('homeCells','${h.id}')">Delete</button></td></tr>`}).join('')}</table>`:'<div class="empty">No home cells registered.</div>'}</div>`}
function autofillHomeLeader(){let m=db.members.find(x=>x.id===v('hleaderId'));vSet('hleader',m?.name||'');vSet('hcontact',m?.contact||'')}
function addHomeCell(){let leader=db.members.find(m=>m.id===v('hleaderId')),x={id:uid(),name:v('hname'),leaderId:leader?.id||'',leader:leader?.name||v('hleader'),contact:leader?.contact||v('hcontact'),location:v('hlocation'),day:v('hday'),description:v('hdesc')};if(!x.name)return alert('Enter the home cell name.');if(db.homeCells.some(h=>h.name.toLowerCase()===x.name.toLowerCase()))return alert('That home cell already exists.');db.homeCells.push(x);save();render()}
function editHomeCell(id){let h=db.homeCells.find(x=>x.id===id);if(!h)return;window._editingHomeCellId=id;vSet('hname',h.name);vSet('hleaderId',h.leaderId||'');vSet('hleader',h.leader||'');vSet('hcontact',h.contact||'');vSet('hlocation',h.location||'');vSet('hday',h.day||'');vSet('hdesc',h.description||'');$('homeCellSaveBtn').textContent='Save Changes';$('homeCellCancelBtn').style.display='inline-block';document.getElementById('hname')?.focus()}
function cancelHomeCellEdit(){window._editingHomeCellId='';['hname','hleader','hcontact','hlocation','hday','hdesc'].forEach(id=>vSet(id,''));vSet('hleaderId','');$('homeCellSaveBtn').textContent='Register Home Cell';$('homeCellCancelBtn').style.display='none'}
function saveHomeCellForm(){if(!window._editingHomeCellId)return addHomeCell();let h=db.homeCells.find(x=>x.id===window._editingHomeCellId);if(!h)return cancelHomeCellEdit();let leader=db.members.find(m=>m.id===v('hleaderId')),name=v('hname').trim();if(!name)return alert('Enter the home cell name.');if(db.homeCells.some(x=>x.id!==h.id&&x.name.toLowerCase()===name.toLowerCase()))return alert('That home cell already exists.');Object.assign(h,{name,leaderId:leader?.id||'',leader:leader?.name||v('hleader'),contact:leader?.contact||v('hcontact'),location:v('hlocation'),day:v('hday'),description:v('hdesc')});window._editingHomeCellId='';save();render()}

function filterMercyContributors(){let cell=v('miCell'),q=v('mercyPersonSearch').trim().toLowerCase(),sel=$('miMember');if(!sel)return;let members=db.members.filter(m=>m.cell===db.homeCells.find(h=>h.id===cell)?.name&&memberSearchText(m).includes(q));sel.innerHTML='<option value="">-- Select Contributor --</option>'+members.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.churchId)})</option>`).join('')+'<option value="OTHER">Other / Non-member</option>'}
function loadMercyContributors(cellId,memberId){let cell=v(cellId),sel=$(memberId);if(!sel)return;let members=db.members.filter(m=>m.cell===db.homeCells.find(h=>h.id===cell)?.name);sel.innerHTML='<option value="">-- Select Contributor --</option>'+members.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.churchId)})</option>`).join('')+'<option value="OTHER">Other / Non-member</option>';if(memberId==='miMember')autofillMercyContributor()}
function autofillMercyContributor(){let id=v('miMember'),m=db.members.find(x=>x.id===id);if(m){vSet('miName',m.name);vSet('miChurchId',m.churchId);vSet('miContact',m.contact);vSet('miResidence',m.residence)}else if(id==='OTHER'){vSet('miName','');vSet('miChurchId','Non-member');vSet('miContact','');vSet('miResidence','')}else{vSet('miName','');vSet('miChurchId','');vSet('miContact','');vSet('miResidence','')}}
function addMercyIncome(){let a=+v('miAmt'),cell=v('miCell'),member=v('miMember');if(a<=0||!cell||!v('miName').trim())return alert('Select a home cell, contributor and valid amount.');let m=db.members.find(x=>x.id===member),x={id:uid(),date:v('miDate')||today(),homeCellId:cell,contributorMemberId:m?.id||'',contributorName:v('miName').trim(),churchId:v('miChurchId').trim(),contact:v('miContact').trim(),residence:v('miResidence').trim(),category:v('miCat')||'Mercy Support Contribution',amount:a};db.mercyIncome.push(x);save();alert('Mercy Support contribution recorded for '+x.contributorName+'.');render()}
function addMercyExpense(){let a=+v('meAmt'),cell=v('meCell'),purpose=v('mePurpose').trim(),payee=v('mePayee').trim();if(a<=0||!cell||!purpose)return alert('Select a home cell, enter the expense purpose and a valid amount.');let receipt=nextNo('receipt','LSCC-MRC'),x={id:uid(),date:v('meDate')||today(),homeCellId:cell,purpose,category:'Mercy Support Expense',payee,payment:v('mePayment'),amount:a,receiptNo:receipt};db.mercyExpenses.push(x);save();render();setTimeout(()=>printMercyReceipt(x.id),50)}
function printMercyReceipt(id){let x=db.mercyExpenses.find(q=>q.id===id);if(!x)return;let h=db.homeCells.find(q=>q.id===x.homeCellId);let html=`<div style="max-width:680px;margin:auto;border:1px solid #ccc;padding:28px;font-family:Arial">${receiptLogoMarkup()}<h2 style="text-align:center">${esc(db.settings.name)}</h2><h3 style="text-align:center">MERCY SUPPORT EXPENSE RECEIPT</h3><p><b>Receipt No:</b> ${esc(x.receiptNo||'-')} &nbsp; <b>Date:</b> ${esc(x.date)}</p><p><b>Home Cell:</b> ${esc(h?.name||'-')}</p><table style="width:100%;border-collapse:collapse"><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Purpose</th><td style="border:1px solid #ccc;padding:8px">${esc(x.purpose||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Payee / Recipient</th><td style="border:1px solid #ccc;padding:8px">${esc(x.payee||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Payment Method</th><td style="border:1px solid #ccc;padding:8px">${esc(x.payment||'-')}</td></tr><tr><th style="border:1px solid #ccc;padding:8px;text-align:left">Amount</th><td style="border:1px solid #ccc;padding:8px"><b>${money(x.amount)}</b></td></tr></table><br><p>Prepared by: ${esc(currentUser()?.name||'-')}</p><p style="margin-top:50px">Authorized Signature: __________________________</p></div>`;let w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print the receipt.');w.document.write(`<html><head><title>${esc(x.receiptNo||'Mercy Receipt')}</title></head><body>${html}</body></html>`);w.document.close();w.focus();w.print()}
function planning(){let opts=db.members.filter(m=>m.type==='Minister'||m.department==='Pastoral Team');let services=['Monday Prayer','Wednesday Midweek Service','Thursday Online Fellowship','Sunday First Service','Sunday Second Service'];return `<div class="panel"><h2>Weekly Service Planning Program</h2><div class="notice">Only Ministers or members assigned to the Pastoral Team can be selected for service planning and the Sunday Ministers' Prayer coordinator.</div><div class="form">${services.map((s,i)=>{let x=db.programs.find(p=>p.service===s)||{};return `<div class="panel"><h3>${s}</h3><label>Programmer</label><select id="prog${i}"><option value="">-- Select --</option>${opts.map(m=>`<option value="${m.id}" ${x.programmerId===m.id?'selected':''}>${esc(m.name)} (${esc(m.churchId)})</option>`).join('')}</select><label style="margin-top:8px">Preacher</label><select id="preach${i}"><option value="">-- Select --</option>${opts.map(m=>`<option value="${m.id}" ${x.preacherId===m.id?'selected':''}>${esc(m.name)} (${esc(m.churchId)})</option>`).join('')}</select><label style="margin-top:8px">Details / Theme</label><textarea id="pdet${i}">${esc(x.details||'')}</textarea></div>`}).join('')}</div><div class="panel"><h3>Sunday Ministers' Prayer</h3><label>Coordinator</label><select id="ministerPrayerCoord"><option value="">-- Select Coordinator --</option>${opts.map(m=>`<option value="${m.id}" ${db.programs.find(p=>p.service==="Sunday Ministers' Prayer")?.coordinatorId===m.id?'selected':''}>${esc(m.name)} (${esc(m.churchId)})</option>`).join('')}</select><label style="margin-top:8px">Prayer Details / Focus</label><textarea id="ministerPrayerDetails">${esc(db.programs.find(p=>p.service==="Sunday Ministers' Prayer")?.details||'')}</textarea></div><div class="actions"><button class="primary" onclick="savePlanning()">Save Weekly Program</button><button class="btn" onclick="printPlanning()">Print / Share Program</button><button class="btn" onclick="archiveCurrentWeek();alert('Current program archived.');render()">Archive This Week</button></div></div><div class="panel"><h2>Previous Weeks</h2>${db.programArchive.length?`<table><tr><th>Week</th><th>Saved At</th><th>Programs</th><th></th></tr>${db.programArchive.slice().reverse().map(a=>`<tr><td>${esc(a.week)}</td><td>${new Date(a.savedAt).toLocaleString()}</td><td>${a.programs.length}</td><td><button class="btn" onclick="viewArchive('${a.id}')">View</button></td></tr>`).join('')}</table>`:'<div class="empty">No previous weekly programs archived yet.</div>'}</div><div id="archiveOut"></div>`}
function printPlanning(){let rows=db.programs||[];let html=`<div class="panel"><h2>${esc(db.settings.name)} - Weekly Service Planning</h2><p>Week of ${esc(programWeekKey())}</p><table><tr><th>Service</th><th>Programmer / Coordinator</th><th>Preacher</th><th>Details</th></tr>${rows.map(x=>{let p=db.members.find(m=>m.id===x.programmerId),q=db.members.find(m=>m.id===x.preacherId),c=db.members.find(m=>m.id===x.coordinatorId);return `<tr><td>${esc(x.service)}</td><td>${esc((p||c)?.name||'-')}</td><td>${esc(q?.name||'-')}</td><td>${esc(x.details||'-')}</td></tr>`}).join('')}</table></div>`;let w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print/share the program.');w.document.write(`<html><head><title>Weekly Service Planning</title><style>body{font:14px Arial;padding:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px;text-align:left}th{background:#f1f5f9}.loginheadline{font-weight:800;color:#2563eb;margin:4px 0 16px;animation:lsccHeadline 3s ease-in-out infinite alternate}@keyframes lsccHeadline{from{opacity:.55;transform:translateX(-4px)}to{opacity:1;transform:translateX(4px)}}.readonly{background:#f8fafc}</style></head><body>${html}</body></html>`);w.document.close();w.focus();w.print()}
function savePlanning(){let names=['Monday Prayer','Wednesday Midweek Service','Thursday Online Fellowship','Sunday First Service','Sunday Second Service'];let coord=v('ministerPrayerCoord'),allowed=db.members.filter(m=>m.type==='Minister'||m.department==='Pastoral Team').map(m=>m.id);if(coord&&!allowed.includes(coord))return alert('Coordinator must be a Minister or Pastoral Team member.');db.programs=names.map((service,i)=>({id:uid(),service,programmerId:v('prog'+i),preacherId:v('preach'+i),details:v('pdet'+i)}));db.programs.push({id:uid(),service:"Sunday Ministers' Prayer",coordinatorId:coord,details:v('ministerPrayerDetails')});save();alert('Weekly service program saved.');render()}
function viewArchive(id){let a=db.programArchive.find(x=>x.id===id);if(!a)return;let find=id=>db.members.find(m=>m.id===id)?.name||'-';$('archiveOut').innerHTML=`<div class="panel"><h2>Archived Week: ${esc(a.week)}</h2><table><tr><th>Service</th><th>Programmer / Coordinator</th><th>Preacher</th><th>Details</th></tr>${a.programs.map(x=>`<tr><td>${esc(x.service)}</td><td>${esc(find(x.programmerId||x.coordinatorId))}</td><td>${esc(find(x.preacherId))}</td><td>${esc(x.details||'')}</td></tr>`).join('')}</table></div>`}
function clock(){let el=$('clock');if(!el)return;let tick=()=>{let d=new Date();el.textContent=d.toLocaleDateString('en-KE',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})+' • '+d.toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});archiveProgramsIfNeeded()};tick();clearInterval(window.lsccClock);window.lsccClock=setInterval(tick,1000)}
function calendar(){let y=+(v('calYear')||new Date().getFullYear());let ev=db.events.filter(e=>+e.date.slice(0,4)===y).sort((a,b)=>a.date.localeCompare(b.date));let months=Array.from({length:12},(_,i)=>{let a=ev.filter(e=>new Date(e.date+'T00:00:00').getMonth()===i);return `<div class="calendar-day"><h4>${new Date(y,i,1).toLocaleString('en',{month:'long'})}</h4>${a.length?a.map(e=>`<div><span class="pill">${e.date.slice(8,10)}${e.time?' '+esc(e.time):''}</span> <b>${esc(e.title)}</b><div class="small">${esc(e.venue||'')} ${e.notes?'• '+esc(e.notes):''}</div></div>`).join(''):'<div class="small sub">No events</div>'}</div>`}).join('');return `<div class="panel"><h2>Church Calendar & Annual Events</h2><div class="form"><div><label>Year</label><input id="calYear" type="number" value="${y}"></div><div><label>Event Date</label><input id="evdate" type="date" value="${y}-01-01"></div><div><label>Time</label><input id="evtime" type="time"></div><div><label>Event / Program Name</label><input id="evtitle"></div><div><label>Venue</label><input id="evvenue"></div><div><label>Notes</label><input id="evnotes"></div></div><div class="actions"><button id="eventSaveBtn" class="primary" onclick="saveEventForm()">Add Event</button><button id="eventCancelBtn" class="btn" style="display:none" onclick="cancelEventEdit()">Cancel</button><button class="btn" onclick="render()">Show Year</button></div></div><div class="panel"><h2>${y} Annual Calendar</h2><div class="calendar-grid">${months}</div></div><div class="panel"><h2>Event List</h2>${ev.length?`<table class="calendar-list"><tr><th>Date</th><th>Time</th><th>Event</th><th>Venue</th><th>Notes</th><th></th></tr>${ev.map(e=>`<tr><td>${e.date}</td><td>${esc(e.time||'-')}</td><td><b>${esc(e.title)}</b></td><td>${esc(e.venue||'-')}</td><td>${esc(e.notes||'-')}</td><td><button class="btn" onclick="editEvent('${e.id}')">Edit</button> <button class="btn danger" onclick="delEvent('${e.id}')">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No events recorded for this year.</div>'}</div>`}
function addEvent(){let date=v('evdate'),title=v('evtitle').trim();if(!date||!title)return alert('Event date and event name are required.');db.events.push({id:uid(),date,time:v('evtime'),title,venue:v('evvenue'),notes:v('evnotes')});save();render()}
function editEvent(id){let e=db.events.find(x=>x.id===id);if(!e)return;window._editingEventId=id;vSet('evdate',e.date);vSet('evtime',e.time||'');vSet('evtitle',e.title);vSet('evvenue',e.venue||'');vSet('evnotes',e.notes||'');$('eventSaveBtn').textContent='Save Changes';$('eventCancelBtn').style.display='inline-block';document.getElementById('evtitle')?.focus()}
function cancelEventEdit(){window._editingEventId='';vSet('evdate','');vSet('evtime','');vSet('evtitle','');vSet('evvenue','');vSet('evnotes','');$('eventSaveBtn').textContent='Add Event';$('eventCancelBtn').style.display='none'}
function saveEventForm(){if(!window._editingEventId)return addEvent();let e=db.events.find(x=>x.id===window._editingEventId);if(!e)return cancelEventEdit();let date=v('evdate'),title=v('evtitle').trim();if(!date||!title)return alert('Event date and event name are required.');Object.assign(e,{date,title,time:v('evtime'),venue:v('evvenue'),notes:v('evnotes')});window._editingEventId='';save();render()}

function delEvent(id){if(!confirm('Delete this event?'))return;db.events=db.events.filter(e=>e.id!==id);save();reloadDatabase();render()}
function eligibleLeaders(){return db.members.filter(m=>['Minister','Pastor','Elder'].includes(m.type))}
function special(){let leaders=eligibleLeaders();let selected=v('sdSelect')||db.specialDepartments[0]?.id||'';let d=db.specialDepartments.find(x=>x.id===selected);let sm=d?db.specialMembers.filter(x=>x.departmentId===d.id):[];let si=d?db.specialIncome.filter(x=>x.departmentId===d.id):[],se=d?db.specialExpenses.filter(x=>x.departmentId===d.id):[];return `<div class="panel"><h2>Special Departments</h2><div class="notice">These departments have their own membership and finances. Their income and expenses are kept completely separate from the main church income and expense accounts.</div><div class="form"><div><label>Department Name</label><input id="sdname" placeholder="e.g. School Ministry"></div><div><label>Leader</label><select id="sdleader" onchange="autofillLeaderContact()"><option value="">-- Select Minister / Pastor / Elder --</option>${leaders.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.type)})</option>`).join('')}</select></div><div><label>Contact</label><input id="sdcontact"></div><div><label>Meeting Day</label><input id="sdday"></div><div><label>Meeting Time</label><input id="sdtime" type="time"></div><div><label>Purpose / Description</label><input id="sddesc"></div></div><div class="actions"><button id="specialDeptSaveBtn" class="primary" onclick="saveSpecialDepartmentForm()">Create Special Department</button><button id="specialDeptCancelBtn" class="btn" style="display:none" onclick="cancelSpecialDepartmentEdit()">Cancel</button></div></div><div class="panel"><h2>Registered Special Departments (${db.specialDepartments.length})</h2>${db.specialDepartments.length?`<table><tr><th>Department</th><th>Leader</th><th>Contact</th><th>Meeting</th><th>Members</th><th>Income</th><th>Expenses</th><th>Balance</th><th></th></tr>${db.specialDepartments.map(x=>{let l=db.members.find(m=>m.id===x.leaderId),mi=db.specialMembers.filter(a=>a.departmentId===x.id).length,inc=sum(db.specialIncome.filter(a=>a.departmentId===x.id)),ex=sum(db.specialExpenses.filter(a=>a.departmentId===x.id));return `<tr><td><b>${esc(x.name)}</b><div class="sub">${esc(x.description||'')}</div></td><td>${esc(l?.name||'-')}</td><td>${esc(x.contact||'-')}</td><td>${esc(x.day||'-')} ${esc(x.time||'')}</td><td>${mi}</td><td class="green">${money(inc)}</td><td class="red">${money(ex)}</td><td>${money(inc-ex)}</td><td><button class="btn" onclick="editSpecialDepartment('${x.id}')">Edit</button> <button class="btn" onclick="goSpecial('${x.id}')">Manage</button> <button class="btn danger" onclick="delSpecial('${x.id}')">Delete</button></td></tr>`}).join('')}</table>`:'<div class="empty">No special departments created.</div>'}</div>${d?specialManage(d,sm,si,se):''}`}
function editSpecialDepartment(id){let d=db.specialDepartments.find(x=>x.id===id);if(!d)return;window._editingSpecialDepartmentId=id;vSet('sdname',d.name);vSet('sdleader',d.leaderId||'');vSet('sdcontact',d.contact||'');vSet('sdday',d.day||'');vSet('sdtime',d.time||'');vSet('sddesc',d.description||'');$('specialDeptSaveBtn').textContent='Save Changes';$('specialDeptCancelBtn').style.display='inline-block';document.getElementById('sdname')?.focus()}
function cancelSpecialDepartmentEdit(){window._editingSpecialDepartmentId='';['sdname','sdcontact','sdday','sdtime','sddesc'].forEach(id=>vSet(id,''));vSet('sdleader','');$('specialDeptSaveBtn').textContent='Create Special Department';$('specialDeptCancelBtn').style.display='none'}
function saveSpecialDepartmentForm(){if(!window._editingSpecialDepartmentId)return addSpecialDepartment();let d=db.specialDepartments.find(x=>x.id===window._editingSpecialDepartmentId);if(!d)return cancelSpecialDepartmentEdit();let name=v('sdname').trim(),leaderId=v('sdleader');if(!name||!leaderId)return alert('Department name and an eligible leader are required.');let leader=db.members.find(m=>m.id===leaderId);if(!leader||!['Minister','Pastor','Elder'].includes(leader.type))return alert('Leader must be a Minister, Pastor or Elder from the main church database.');Object.assign(d,{name,leaderId,contact:v('sdcontact'),day:v('sdday'),time:v('sdtime'),description:v('sddesc')});window._editingSpecialDepartmentId='';save();render()}
